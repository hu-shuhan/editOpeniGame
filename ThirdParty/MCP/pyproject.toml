[project]
name = "mcp-project"
version = "0.1.0"
description = "MCP AI Assistant with Socket Server for C++ Client Communication"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastmcp>=0.2.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "mcp>=1.0.0",
    "matplotlib>=3.5.0",
    "Pillow>=10.0.0",
    "numpy>=1.21.0",
    "requests>=2.25.0",
    "websockets>=10.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "loguru>=0.7.0",
]
