<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>iGameVis Version.Web</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1b2430;
            --accent: #0e7490;
            --line: #d7e2ef;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at 15% 20%, #e5f2ff 0%, var(--bg) 45%), var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(20, 40, 70, 0.08);
        }

        #log {
            min-height: 60px;
            white-space: pre-wrap;
            font-size: 13px;
            margin-top: 12px;
            border-top: 1px solid var(--line);
            padding-top: 10px;
        }

        #canvas {
            width: 60%;
            height: 540px;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-top: 14px;
            background: #0b0f14;
            display: block;
        }

        .viewer-shell {
            position: relative;
            margin-top: 14px;
        }

        .viewer-shell #canvas {
            margin-top: 0;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .build-marker {
            display: inline-flex;
            align-items: center;
            margin: 0 0 12px;
            padding: 6px 10px;
            border: 1px solid #a7f3d0;
            border-radius: 6px;
            background: #ecfdf5;
            color: #047857;
            font-size: 13px;
            font-weight: 600;
        }

        button {
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            padding: 10px 14px;
            cursor: pointer;
        }

        details.color-map-panel {
            margin-top: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fbfdff;
            overflow: hidden;
        }

        details.color-map-panel>summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text);
            background: linear-gradient(180deg, #f7fbff, #eef5fc);
            border-bottom: 1px solid var(--line);
        }

        details.color-map-panel>summary::-webkit-details-marker {
            display: none;
        }

        .color-map-body {
            padding: 14px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <h2>iGameVis Version.Web</h2>
            <div class="build-marker">Build marker: 2026-06-13_V1</div>
            <div class="row">

    <script>
        const log = (msg) => {
            const logElement = document.getElementById('log');
            if (!logElement) return;
            const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logElement.textContent = logElement.textContent === 'Waiting for wasm...'
                ? line
                : `${logElement.textContent}\n${line}`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(line);
        };
        let renderLoopStarted = false;
        let viewerDestroyed = false;
        let wasmAsyncCallActive = false;
        let postLoadRenderTiming = null;
        const expectedWasmBuild = {
            buildId: '@IGAME_WASM_BUILD_ID@',
            memoryProfile: '@IGAME_WASM_MEMORY_PROFILE@',
        };
        const queryParameters = new URLSearchParams(window.location.search);
        const singleFrameBenchmarkMode =
            queryParameters.get('singleFrameBenchmark') !== '0';
        const readOptionalBoolean = (name) => {
            const value = queryParameters.get(name);
            return value === null ? null : value !== '0';
        };
        const decodedFrameCacheOverride = readOptionalBoolean('decodedFrameCache');
        const encodedInputCacheOverride = readOptionalBoolean('encodedInputCache');
        const fullInputPrefetchOverride = readOptionalBoolean('fullInputPrefetch');
        const dataCodecCacheExperimentEnabled =
            decodedFrameCacheOverride !== null ||
            encodedInputCacheOverride !== null ||
            fullInputPrefetchOverride !== null;
        const dataCodecCacheExperiment = {
            decodedFrameCache: decodedFrameCacheOverride ?? !singleFrameBenchmarkMode,
            encodedInputCache: encodedInputCacheOverride ?? false,
            fullInputPrefetch: fullInputPrefetchOverride ?? !singleFrameBenchmarkMode,
        };
        const dataCodecMemoryObservation = {
            peakLinearMemoryBytes: 0,
            peakJsHeapBytes: 0,
        };
        const captureDataCodecMemoryObservation = () => {
            const linearMemoryBytes = Module.HEAPU8 ? Module.HEAPU8.byteLength : 0;
            const jsHeapBytes = performance.memory && Number.isFinite(performance.memory.usedJSHeapSize)
                ? performance.memory.usedJSHeapSize
                : 0;
            dataCodecMemoryObservation.peakLinearMemoryBytes = Math.max(
                dataCodecMemoryObservation.peakLinearMemoryBytes,
                linearMemoryBytes);
            dataCodecMemoryObservation.peakJsHeapBytes = Math.max(
                dataCodecMemoryObservation.peakJsHeapBytes,
                jsHeapBytes);
            return {
                linearMemoryBytes,
                jsHeapBytes,
                ...dataCodecMemoryObservation,
            };
        };
        const crossPageCacheProtocolVersion = 4;
        const packageInspectionPrefixBudget = 64;

        const inspectIgcPackage = async (file) => {
            if (!file || !Number.isSafeInteger(file.size) || file.size <= 0) {
                throw new Error('invalid IGC file size');
            }
            const prefix = new Uint8Array(await file.slice(
                0,
                Math.min(file.size, packageInspectionPrefixBudget)).arrayBuffer());
            const resultJson = api.inspectIgcPackage(prefix, file.size);
            if (!resultJson) {
                throw new Error(`package inspection failed: ${api.getLastErrorJson()}`);
            }
            const inspection = JSON.parse(resultJson);
            if (!inspection.identity || !inspection.sourceIdentity) {
                throw new Error('package inspection returned an incomplete identity');
            }
            return inspection;
        };

        const createCrossPageDecodeCoordinator = () => {
            const localLease = {
                coordinated: false,
                release() {},
            };
            if (singleFrameBenchmarkMode) {
                log('[Benchmark] cross-page and persistent reuse disabled');
                return { acquire: async () => localLease };
            }
            if (typeof SharedWorker !== 'function') {
                log('[Cross-page cache] SharedWorker unavailable');
                return { acquire: async () => localLease };
            }
            const pageId = typeof crypto.randomUUID === 'function'
                ? crypto.randomUUID()
                : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            let worker;
            try {
                worker = new SharedWorker(
                    `cache.js?build=${expectedWasmBuild.buildId}-${expectedWasmBuild.memoryProfile}&protocol=${crossPageCacheProtocolVersion}`,
                    {
                        name: `igame-cache-${expectedWasmBuild.buildId}-${expectedWasmBuild.memoryProfile}-v${crossPageCacheProtocolVersion}`,
                        type: 'classic',
                    });
            } catch (error) {
                throw new Error(
                    `SharedWorker initialization failed: ${String(error && error.message || error)}`);
            }

            const port = worker.port;
            const pending = new Map();
            let nextRequestId = 1;
            port.onmessage = (event) => {
                const message = event.data || {};
                if (message.type === 'artifact-published') {
                    log(`[Cross-page cache] artifact accepted contentId=${String(message.contentKey || '').slice(-32)} bytes=${Number(message.residentBytes) || 0}`);
                    return;
                }
                if (message.type === 'artifact-rejected') {
                    log(`[Cross-page cache] artifact rejected contentId=${String(message.contentKey || '').slice(-32)} detail=${String(message.detail || '')}`);
                    return;
                }
                const request = pending.get(message.requestId);
                if (!request) {
                    return;
                }
                if (message.type === 'queued') {
                    request.onQueued(message);
                    return;
                }
                pending.delete(message.requestId);
                if (message.type === 'error') {
                    request.reject(new Error(String(message.detail || 'coordinator request failed')));
                    return;
                }
                request.resolve(message);
            };
            port.start();

            const request = (type, payload = {}, onQueued = () => {}) => new Promise((resolve, reject) => {
                const requestId = nextRequestId++;
                pending.set(requestId, { resolve, reject, onQueued });
                try {
                    port.postMessage({ type, pageId, requestId, ...payload });
                } catch (error) {
                    pending.delete(requestId);
                    reject(error);
                }
            });

            const ready = request('register');
            const disconnect = () => {
                try {
                    port.postMessage({ type: 'disconnect', pageId });
                    port.close();
                } catch (_error) {
                }
            };
            window.addEventListener('beforeunload', disconnect, { once: true });

            return {
                async acquire(contentKey) {
                    try {
                        await ready;
                        const owner = await request(
                            'acquire',
                            { contentKey },
                            (queued) => {
                                log(`[Cross-page cache] waiting contentId=${contentKey.slice(-32)} owner=${queued.ownerPageId} queue=${queued.queuePosition}`);
                            });
                        if (owner.type === 'artifact' && owner.artifact) {
                            log(`[Cross-page cache] shared surface hit contentId=${contentKey.slice(-32)} bytes=${Number(owner.residentBytes) || 0}`);
                            return {
                                coordinated: true,
                                artifact: owner.artifact,
                                release() {},
                            };
                        }
                        if (owner.previousResult) {
                            log(`[Cross-page cache] previous owner completed success=${Boolean(owner.previousResult.success)} detail=${String(owner.previousResult.detail || '')}`);
                        }
                        log(`[Cross-page cache] owner contentId=${contentKey.slice(-32)} page=${pageId}`);
                        let released = false;
                        const heartbeat = setInterval(() => {
                            if (!released) {
                                port.postMessage({ type: 'heartbeat', pageId, contentKey });
                            }
                        }, 15000);
                        return {
                            coordinated: true,
                            release(success, detail = '', artifact = null) {
                                if (released) {
                                    return;
                                }
                                released = true;
                                clearInterval(heartbeat);
                                port.postMessage({
                                    type: 'complete',
                                    pageId,
                                    contentKey,
                                    success: Boolean(success),
                                    detail: String(detail || ''),
                                    artifact,
                                });
                            },
                        };
                    } catch (error) {
                        throw new Error(
                            `cross-page coordination failed: ${String(error && error.message || error)}`);
                    }
                },
            };
        };

        const crossPageDecodeCoordinator = createCrossPageDecodeCoordinator();
        window.igameCrossPageDecodeCoordinator = crossPageDecodeCoordinator;

        const copyTypedArrayToCacheBuffer = (typedArray) => {
            const buffer = new ArrayBuffer(typedArray.byteLength);
            new Uint8Array(buffer).set(new Uint8Array(
                typedArray.buffer,
                typedArray.byteOffset,
                typedArray.byteLength));
            return buffer;
        };

        const createPersistentSurfaceCache = () => {
            const cacheVersion = 2;
            const cacheDirectoryName = 'igame-surface-cache-v1';
            const maxArtifactCount = 2;
            const maxResidentBytes = 512 * 1024 * 1024;
            const supported = Boolean(navigator.storage &&
                typeof navigator.storage.getDirectory === 'function');

            const contentLabel = (contentKey) => String(contentKey || '').slice(-32);
            const entryNameFor = (contentKey) => String(contentKey || '')
                .replace(/[^a-zA-Z0-9._-]/g, '_')
                .slice(0, 220);

            const openCacheDirectory = async (create) => {
                if (!supported) {
                    return null;
                }
                const root = await navigator.storage.getDirectory();
                return root.getDirectoryHandle(cacheDirectoryName, { create });
            };

            const readMetadata = async (entryDirectory) => {
                const handle = await entryDirectory.getFileHandle('metadata.json');
                const file = await handle.getFile();
                return JSON.parse(await file.text());
            };

            const writeFile = async (directory, name, value) => {
                const handle = await directory.getFileHandle(name, { create: true });
                const writable = await handle.createWritable();
                try {
                    await writable.write(value);
                    await writable.close();
                } catch (error) {
                    try {
                        await writable.abort(error);
                    } catch (_abortError) {
                    }
                    throw error;
                }
            };

            const removeEntry = async (contentKey) => {
                try {
                    const cacheDirectory = await openCacheDirectory(false);
                    if (!cacheDirectory) {
                        return;
                    }
                    await cacheDirectory.removeEntry(entryNameFor(contentKey), { recursive: true });
                } catch (error) {
                    if (!error || error.name !== 'NotFoundError') {
                        log(`[Persistent surface cache] remove failed contentId=${contentLabel(contentKey)} detail=${String(error && error.message || error)}`);
                    }
                }
            };

            const validateMetadata = (metadata, contentKey, packageIdentity, sourceBytes) => {
                if (!metadata || metadata.version !== cacheVersion ||
                    metadata.buildId !== expectedWasmBuild.buildId ||
                    metadata.memoryProfile !== expectedWasmBuild.memoryProfile ||
                    metadata.contentKey !== contentKey ||
                    metadata.packageIdentity !== packageIdentity ||
                    Number(metadata.sourceBytes) !== Number(sourceBytes)) {
                    return false;
                }
                const positionsBytes = Number(metadata.positionsBytes);
                const trianglesBytes = Number(metadata.trianglesBytes);
                const edgeMasksBytes = Number(metadata.edgeMasksBytes);
                const residentBytes = positionsBytes + trianglesBytes + edgeMasksBytes;
                return Number.isSafeInteger(positionsBytes) && positionsBytes > 0 &&
                    Number.isSafeInteger(trianglesBytes) && trianglesBytes > 0 &&
                    Number.isSafeInteger(edgeMasksBytes) && edgeMasksBytes > 0 &&
                    Number.isSafeInteger(residentBytes) &&
                    residentBytes === Number(metadata.residentBytes) &&
                    residentBytes <= maxResidentBytes;
            };

            const prune = async (protectedEntryName) => {
                const cacheDirectory = await openCacheDirectory(false);
                if (!cacheDirectory) {
                    return;
                }
                let quotaBudget = maxResidentBytes;
                try {
                    const estimate = await navigator.storage.estimate();
                    if (Number.isFinite(estimate.quota) && estimate.quota > 0) {
                        quotaBudget = Math.min(maxResidentBytes, Math.floor(estimate.quota * 0.2));
                    }
                } catch (_error) {
                }

                const entries = [];
                for await (const [name, handle] of cacheDirectory.entries()) {
                    if (handle.kind !== 'directory') {
                        continue;
                    }
                    try {
                        const metadata = await readMetadata(handle);
                        entries.push({
                            name,
                            residentBytes: Number(metadata.residentBytes) || 0,
                            lastAccessedAt: Number(metadata.lastAccessedAt) || 0,
                        });
                    } catch (_error) {
                        entries.push({ name, residentBytes: 0, lastAccessedAt: 0 });
                    }
                }

                let totalBytes = entries.reduce((sum, entry) => sum + entry.residentBytes, 0);
                let totalCount = entries.length;
                const candidates = entries
                    .filter((entry) => entry.name !== protectedEntryName)
                    .sort((lhs, rhs) => lhs.lastAccessedAt - rhs.lastAccessedAt);
                for (const entry of candidates) {
                    if (totalCount <= maxArtifactCount && totalBytes <= quotaBudget) {
                        break;
                    }
                    await cacheDirectory.removeEntry(entry.name, { recursive: true });
                    totalCount -= 1;
                    totalBytes -= entry.residentBytes;
                    log(`[Persistent surface cache] evicted entry=${entry.name} bytes=${entry.residentBytes}`);
                }
            };

            return {
                supported,

                async load(contentKey, packageIdentity, sourceBytes) {
                    if (!supported) {
                        return null;
                    }
                    const startedAt = performance.now();
                    try {
                        const cacheDirectory = await openCacheDirectory(false);
                        if (!cacheDirectory) {
                            return null;
                        }
                        const entryDirectory = await cacheDirectory.getDirectoryHandle(entryNameFor(contentKey));
                        const metadata = await readMetadata(entryDirectory);
                        if (!validateMetadata(metadata, contentKey, packageIdentity, sourceBytes)) {
                            await removeEntry(contentKey);
                            throw new Error(
                                `invalid persistent cache metadata contentId=${contentLabel(contentKey)}`);
                        }

                        const [positionsFile, trianglesFile, edgeMasksFile] = await Promise.all([
                            entryDirectory.getFileHandle('positions.bin').then((handle) => handle.getFile()),
                            entryDirectory.getFileHandle('triangles.bin').then((handle) => handle.getFile()),
                            entryDirectory.getFileHandle('edge-masks.bin').then((handle) => handle.getFile()),
                        ]);
                        if (positionsFile.size !== Number(metadata.positionsBytes) ||
                            trianglesFile.size !== Number(metadata.trianglesBytes) ||
                            edgeMasksFile.size !== Number(metadata.edgeMasksBytes)) {
                            await removeEntry(contentKey);
                            throw new Error(
                                `invalid persistent cache file sizes contentId=${contentLabel(contentKey)}`);
                        }

                        const [positions, triangles, edgeMasks] = await Promise.all([
                            positionsFile.arrayBuffer(),
                            trianglesFile.arrayBuffer(),
                            edgeMasksFile.arrayBuffer(),
                        ]);
                        metadata.lastAccessedAt = Date.now();
                        await writeFile(
                            entryDirectory,
                            'metadata.json',
                            new TextEncoder().encode(JSON.stringify(metadata)));
                        log(`[Persistent surface cache] hit contentId=${contentLabel(contentKey)} bytes=${metadata.residentBytes} elapsed=${(performance.now() - startedAt).toFixed(2)} ms`);
                        return { version: cacheVersion, positions, triangles, edgeMasks };
                    } catch (error) {
                        if (error && error.name === 'NotFoundError') {
                            log(`[Persistent surface cache] miss contentId=${contentLabel(contentKey)}`);
                            return null;
                        }
                        throw new Error(
                            `persistent cache load failed contentId=${contentLabel(contentKey)}: ${String(error && error.message || error)}`);
                    }
                },

                async store(contentKey, packageIdentity, sourceBytes, artifact) {
                    if (!supported || !artifact) {
                        return false;
                    }
                    const positionsBytes = Number(artifact.positions && artifact.positions.byteLength) || 0;
                    const trianglesBytes = Number(artifact.triangles && artifact.triangles.byteLength) || 0;
                    const edgeMasksBytes = Number(artifact.edgeMasks && artifact.edgeMasks.byteLength) || 0;
                    const residentBytes = positionsBytes + trianglesBytes + edgeMasksBytes;
                    if (positionsBytes <= 0 || trianglesBytes <= 0 || edgeMasksBytes <= 0 ||
                        residentBytes > maxResidentBytes) {
                        return false;
                    }

                    const startedAt = performance.now();
                    const entryName = entryNameFor(contentKey);
                    try {
                        const cacheDirectory = await openCacheDirectory(true);
                        const entryDirectory = await cacheDirectory.getDirectoryHandle(entryName, { create: true });
                        await Promise.all([
                            writeFile(entryDirectory, 'positions.bin', new Uint8Array(artifact.positions)),
                            writeFile(entryDirectory, 'triangles.bin', new Uint8Array(artifact.triangles)),
                            writeFile(entryDirectory, 'edge-masks.bin', new Uint8Array(artifact.edgeMasks)),
                        ]);
                        const now = Date.now();
                        const metadata = {
                            version: cacheVersion,
                            buildId: expectedWasmBuild.buildId,
                            memoryProfile: expectedWasmBuild.memoryProfile,
                            contentKey,
                            packageIdentity,
                            sourceBytes,
                            positionsBytes,
                            trianglesBytes,
                            edgeMasksBytes,
                            residentBytes,
                            createdAt: now,
                            lastAccessedAt: now,
                        };
                        await writeFile(
                            entryDirectory,
                            'metadata.json',
                            new TextEncoder().encode(JSON.stringify(metadata)));
                        await prune(entryName);
                        log(`[Persistent surface cache] stored contentId=${contentLabel(contentKey)} bytes=${residentBytes} elapsed=${(performance.now() - startedAt).toFixed(2)} ms`);
                        return true;
                    } catch (error) {
                        await removeEntry(contentKey);
                        throw new Error(
                            `persistent cache store failed contentId=${contentLabel(contentKey)}: ${String(error && error.message || error)}`);
                    }
                },

                async remove(contentKey) {
                    await removeEntry(contentKey);
                },

                async clear() {
                    if (!supported) {
                        return false;
                    }
                    try {
                        const root = await navigator.storage.getDirectory();
                        await root.removeEntry(cacheDirectoryName, { recursive: true });
                        log('[Persistent surface cache] cleared');
                        return true;
                    } catch (error) {
                        if (error && error.name === 'NotFoundError') {
                            return true;
                        }
                        log(`[Persistent surface cache] clear failed detail=${String(error && error.message || error)}`);
                        return false;

            active: false,
            type: '',
            samples: [],
            startedAt: 0,
            wheelTimer: null,

            begin(type) {
                if (this.active && this.type === type) {
                    return;
                }
                if (this.active) {
                    this.end('switch');
                }
                if (this.wheelTimer !== null) {
                    clearTimeout(this.wheelTimer);
                    this.wheelTimer = null;
                }
                this.active = true;
                this.type = type;
                this.samples = [];
                this.startedAt = performance.now();
            },

            record(ms) {
                if (!this.active || !Number.isFinite(ms)) {
                    return;
                }
                this.samples.push(ms);
            },

            end(reason) {
                if (!this.active) {
                    return;
                }
                if (this.wheelTimer !== null) {
                    clearTimeout(this.wheelTimer);
                    this.wheelTimer = null;
                }

                const type = this.type;
                const samples = this.samples.slice();
                this.active = false;
                this.type = '';
                this.samples = [];

                if (samples.length === 0) {
                    return;

                samples.sort((a, b) => a - b);
                const sum = samples.reduce((acc, value) => acc + value, 0);
                const percentile = (p) => {
                    const index = Math.min(samples.length - 1, Math.floor((samples.length - 1) * p));
                    return samples[index];

                const over16 = samples.filter((value) => value > 16.7).length;
                const over33 = samples.filter((value) => value > 33.3).length;
                const avg = sum / samples.length;
                const max = samples[samples.length - 1];

                log(`[Render timing interaction] type=${type} frames=${samples.length} avg=${avg.toFixed(2)} ms p50=${percentile(0.5).toFixed(2)} ms p95=${percentile(0.95).toFixed(2)} ms max=${max.toFixed(2)} ms over16.7=${over16} over33.3=${over33}`);
            },

                // ---------------- ColorMap 编辑器逻辑 ----------------
                const colorNodesEl = document.getElementById('color_nodes');
                const colorCanvas = document.getElementById('color_canvas');
                const colorCtx = colorCanvas.getContext('2d');
                const colorJsonOut = document.getElementById('color_jsonOut');

                function hexToRgb01(hex) {
                    if (hex.startsWith('#')) hex = hex.slice(1);
                    const bigint = parseInt(hex, 16);
                    const r = (bigint >> 16) & 255;
                    const g = (bigint >> 8) & 255;
                    const b = bigint & 255;
                    return [r / 255, g / 255, b / 255];
                }
                function rgb01ToHex(r, g, b) {
                    const toHex = v => {
                        const n = Math.round(Math.max(0, Math.min(1, v)) * 255);
                        return ('0' + n.toString(16)).slice(-2);
                    };
                    return '#' + toHex(r) + toHex(g) + toHex(b);
                }

                function addColorNode(hex = '#000000', pos = 0.0) {
                    const div = document.createElement('div');
                    div.className = 'color-node';
                    div.style.display = 'flex';
                    div.style.gap = '8px';
                    div.style.alignItems = 'center';
                    div.style.marginBottom = '6px';
                    div.innerHTML = `<input type="color" class="color" value="${hex}"/>` +
                        `<input type="number" class="pos" min="0" max="1" step="0.001" value="${pos}" style="width:80px;"/>` +
                        `<button class="remove">删除</button>`;
                    colorNodesEl.appendChild(div);
                    div.querySelector('.remove').onclick = () => { div.remove(); renderColorEditor(); };
                    div.querySelector('.color').oninput = renderColorEditor;
                    div.querySelector('.pos').oninput = renderColorEditor;
                    renderColorEditor();
                }

                function clearColorNodes() { colorNodesEl.innerHTML = ''; }

                function readColorNodes() {
                    const rows = Array.from(colorNodesEl.querySelectorAll('.color-node'));
                    const items = rows.map(r => {
                        const hex = r.querySelector('.color').value;
                        const pos = parseFloat(r.querySelector('.pos').value) || 0.0;
                        return { hex, pos };
                    });
                    items.sort((a, b) => a.pos - b.pos);
                    return items;
                }

                function renderColorEditor() {
                    const items = readColorNodes();
                    if (items.length === 0) { colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height); return; }
                    const grad = colorCtx.createLinearGradient(0, 0, colorCanvas.width, 0);
                    const min = items[0].pos, max = items[items.length - 1].pos;
                    const range = Math.max(1e-6, max - min);
                    items.forEach(it => {
                        const rgb = hexToRgb01(it.hex);
                        const color = `rgb(${Math.round(rgb[0] * 255)},${Math.round(rgb[1] * 255)},${Math.round(rgb[2] * 255)})`;
                        const t = (it.pos - min) / range;
                        grad.addColorStop(t, color);
                    });
                    colorCtx.fillStyle = grad;
                    colorCtx.fillRect(0, 0, colorCanvas.width, colorCanvas.height);
                    colorCtx.fillStyle = '#000';
                    items.forEach(it => {
                        const t = (it.pos - min) / range; const x = Math.round(t * colorCanvas.width);
                        colorCtx.fillRect(x - 1, 0, 2, colorCanvas.height);
                    });

                canvas.style.touchAction = 'none';

                // Old-style handlers are kept as an extra guard for browsers that trigger

                    activePointerId = null;

                window.addEventListener('mousedown', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('mouseup', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('mousemove', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('pointermove', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('pointerup', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('wheel', suppressWindowDefaultIfNeeded, wheelInterceptOptions);
                window.addEventListener('blur', () => {
                    interactionRenderStats.end('window-blur');

                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState !== 'visible') {

                const sendMouseEvent = (type, button, e, delta = 0, overridePos = null) => {
                    const pos = overridePos || getCanvasPos(canvas, e);
                    api.sendMouseEvent(type, button, pos.x, pos.y, delta);
                    if (api.isSlicingMode && api.isSlicingMode()) {

                canvas.addEventListener('pointerdown', (e) => {
                    suppressCanvasDefault(e);
                    try {
                        activePointerId = e.pointerId;
                        activeButton = mapPointerButtonToAction(e);
                        selectionPointer = api.getSelectionMode() !== 0 && activeButton === mouseButton.LeftButton;
                        if (selectionPointer) {
                            selectionPressPos = getCanvasPos(canvas, e);
                            activeButton = mouseButton.MiddleButton;
                        }
                        rightDragLock = activeButton === mouseButton.RightButton;
                        canvas.setPointerCapture(e.pointerId);
                        if (activeButton !== mouseButton.NoButton) {
                            interactionRenderStats.begin('drag');
                        }
                        sendMouseEvent(eventType.MousePress, activeButton, e, 0);
                    } catch (err) {
                        log(`pointer down exception: ${err && err.stack ? err.stack : err}`);
                    }
                }, interceptOptions);

                canvas.addEventListener('pointermove', (e) => {
                    if (e.pointerId === activePointerId || e.buttons !== 0) {
                        suppressCanvasDefault(e);
                    }
                    try {
                        if (selectionPointer && selectionPressPos) {
                            const pos = getCanvasPos(canvas, e);
                            const dx = pos.x - selectionPressPos.x;
                            const dy = pos.y - selectionPressPos.y;
                            if (Math.hypot(dx, dy) > selectionClickMoveThreshold) {
                                selectionPointerMoved = true;
                            }
                        }
                        // Mouse move keeps C++ side mode unchanged; mode is decided at press/release.
                        sendMouseEvent(eventType.MouseMove, mouseButton.NoButton, e, 0);
                    } catch (err) {
                        log(`pointer move exception: ${err && err.stack ? err.stack : err}`);
                    }
                }, interceptOptions);

                const handlePointerRelease = (e) => {
                    suppressCanvasDefault(e);
                    try {
                        if (canvas.hasPointerCapture(e.pointerId)) {
                            canvas.releasePointerCapture(e.pointerId);
                        }
                        const releaseButton = activeButton !== mouseButton.NoButton ? activeButton : mapPointerButtonToAction(e);
                        const releasePos = selectionPointer && !selectionPointerMoved ? selectionPressPos : null;
                        sendMouseEvent(eventType.MouseRelease, releaseButton, e, 0, releasePos);
                        if (selectionPointer && !selectionPointerMoved) {
                            readSelection();
                        }
                        if (api.isSlicingMode && api.isSlicingMode()) {
                            writeClipPlaneFields(readClipPlaneFromWasm());
                            updateSliceStatus(`Slice: active source=${api.getSliceSourceModelId()}`);

                        interactionRenderStats.end('mouse-up');
                        clearInteractionState();
                    } catch (err) {
                        log(`pointer release exception: ${err && err.stack ? err.stack : err}`);
                        interactionRenderStats.end('mouse-up-error');
                        clearInteractionState();
                    }

                canvas.addEventListener('pointerup', handlePointerRelease, interceptOptions);
                canvas.addEventListener('pointercancel', handlePointerRelease, interceptOptions);
                canvas.addEventListener('lostpointercapture', () => {
                    interactionRenderStats.end('lost-pointer-capture');
                    clearInteractionState();

                canvas.addEventListener('wheel', (e) => {

                        sendMouseEvent(eventType.Wheel, mouseButton.NoButton, e, delta);
                        interactionRenderStats.endWheelSoon();
                    } catch (err) {
                        log(`wheel exception: ${err && err.stack ? err.stack : err}`);
                        interactionRenderStats.end('wheel-error');
                    }
                }, wheelInterceptOptions);

                const formatBytes = (value) => {
                    const bytes = Number(value) || 0;
                    if (bytes < 1024) return `${bytes} B`;
                    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(2)} KiB`;
                    if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(2)} MiB`;
                    return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GiB`;
                };
                const errorText = (err) => {
                    const name = err && err.name ? err.name : 'Error';
                    const message = err && err.message ? err.message : String(err);
                    return `${name}: ${message}`;
                };
                const maxDirectFileBytes = 1024 * 1024 * 1024;
                const stagedIgcThresholdBytes = 256 * 1024 * 1024;

                const loadIgcBrowserFile = async (
                    file,
                    sourceName,
                    enableReuseCache = !singleFrameBenchmarkMode) => {
                    if (typeof Module.ccall !== 'function') {
                        log('[Browser file] async ccall is unavailable');
                        return false;
                    }
                    if (!Number.isSafeInteger(file.size) || file.size <= 0) {
                        log(`[Browser file] invalid size=${file.size}`);
                        return false;
                    }

                    const fileId = Module.igameNextBrowserFileId++;
                    Module.igameBrowserFiles.set(fileId, file);
                    Module.igameBrowserFileStats.set(fileId, {
                        requests: 0,
                        bytes: 0,
                        firstOffset: 0,
                        lastOffset: 0,
                    });
                    const mode = document.getElementById('importMode').value;
                    const replaceExisting = mode === 'replace' ? 1 : 0;
                    const reuseCacheEnabled = dataCodecCacheExperimentEnabled
                        ? (dataCodecCacheExperiment.decodedFrameCache ? 1 : 0)
                        : (enableReuseCache ? 1 : 0);
                    wasmAsyncCallActive = true;
                    const loadStart = performance.now();
                    log(`[Browser file] begin fileId=${fileId} name=${sourceName} size=${file.size} (${formatBytes(file.size)}) reuse-cache=${reuseCacheEnabled}`);
                    try {
                        const modelId = await Module.ccall(
                            'igameLoadIgcBrowserFile',
                            'number',
                            ['number', 'number', 'string', 'number', 'number', 'number', 'number'],
                            [
                                fileId,
                                file.size,
                                sourceName,
                                replaceExisting,
                                reuseCacheEnabled,
                                dataCodecCacheExperiment.encodedInputCache ? 1 : 0,
                                dataCodecCacheExperiment.fullInputPrefetch ? 1 : 0,
                            ],
                            { async: true });
                        const elapsed = performance.now() - loadStart;
                        const stats = Module.igameBrowserFileStats.get(fileId);
                        if (!modelId) {
                            Module.igameBrowserFiles.delete(fileId);
                            Module.igameBrowserFileStats.delete(fileId);
                            log(`[Browser file] load failed elapsed=${elapsed.toFixed(2)} ms hostError=${Module.igameBrowserFileLastError} lastError=${api.getLastErrorJson()}`);
                            return false;
                        }
                        log(`[Browser file] loaded modelId=${modelId} elapsed=${elapsed.toFixed(2)} ms requests=${stats ? stats.requests : 0} bytes=${stats ? stats.bytes : 0}`);
                        if (dataCodecCacheExperimentEnabled) {
                            const memory = captureDataCodecMemoryObservation();
                            log(`[Benchmark] linear-memory=${memory.linearMemoryBytes} peak-linear-memory=${memory.peakLinearMemoryBytes} js-heap=${memory.jsHeapBytes} peak-js-heap=${memory.peakJsHeapBytes}`);
                        }
                        log('model loaded, start rendering');
                        armPostLoadRenderTiming(modelId, loadStart);
                        refreshModelList();
                        refreshScalarList();
                        startRenderLoop();
                        return true;
                    } catch (err) {
                        Module.igameBrowserFiles.delete(fileId);
                        Module.igameBrowserFileStats.delete(fileId);
                        log(`[Browser file] exception error=${errorText(err)} hostError=${Module.igameBrowserFileLastError}`);
                        return false;
                    } finally {
                        wasmAsyncCallActive = false;
                    }
                };

                const requestIgcAttribute = async (modelId, catalogIndex, prefetchOnly = false) => {
                    const summarizeReads = () => {
                        let requests = 0;
                        let bytes = 0;
                        for (const stats of Module.igameBrowserFileStats.values()) {
                            requests += stats.requests;
                            bytes += stats.bytes;
                        }
                        return { requests, bytes };
                    };
                    const before = summarizeReads();
                    const startedAt = performance.now();
                    wasmAsyncCallActive = true;
                    try {
                        const result = await Module.ccall(
                            prefetchOnly ? 'igamePrefetchIgcAttribute' : 'igameEnsureIgcAttribute',
                            'number',
                            ['number', 'number'],
                            [modelId, catalogIndex],
                            { async: true });
                        const after = summarizeReads();
                        log(`[Browser file] attribute catalogIndex=${catalogIndex} prefetchOnly=${prefetchOnly ? 1 : 0} elapsed=${(performance.now() - startedAt).toFixed(2)} ms requestsDelta=${after.requests - before.requests} bytesDelta=${after.bytes - before.bytes}`);
                        if (dataCodecCacheExperimentEnabled) {
                            const memory = captureDataCodecMemoryObservation();
                            log(`[Benchmark] attribute-memory catalogIndex=${catalogIndex} linear-memory=${memory.linearMemoryBytes} peak-linear-memory=${memory.peakLinearMemoryBytes} js-heap=${memory.jsHeapBytes} peak-js-heap=${memory.peakJsHeapBytes}`);
                        }
                        return result;
                    } finally {
                        wasmAsyncCallActive = false;
