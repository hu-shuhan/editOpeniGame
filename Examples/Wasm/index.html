                const loadLargeStagedFile = async (file, sourceName, modelKind) => {
                    const totalLoadStartedAt = performance.now();
                    const safeName = String(sourceName || `local.${modelKind}`).replace(/[^a-zA-Z0-9._-]/g, '_');
                    const virtualPath = `/tmp/igame_${Date.now()}_${safeName}`;
                    const chunkSize = 16 * 1024 * 1024;
                    const mode = document.getElementById('importMode').value;
                    const replaceExisting = mode === 'replace';
                    let stageCreated = false;
                    let stagedBytes = 0;
                    let nextProgressPercent = 0;
                    let packageIdentity = '';
                    let sourceIdentity = '';
                    let contentKey = '';
                    let decodeLease = null;
                    let sharedArtifact = null;
                    let loadSucceeded = false;
                    let loadFailureDetail = '';
                    const activateSurfaceArtifact = (artifact, cacheLabel) => {
                        const importStart = performance.now();
                        const modelId = api.loadSharedSurfaceData(
                            new Uint8Array(artifact.positions),
                            new Uint8Array(artifact.triangles),
                            new Uint8Array(artifact.edgeMasks),
                            sourceName,
                            sourceIdentity,
                            replaceExisting);
                        const importElapsed = performance.now() - importStart;
                        if (!modelId) {
                            throw new Error(`${cacheLabel} surface import failed: ${api.getLastErrorJson()}`);
                        }
                        const artifactBytes = artifact.positions.byteLength +
                            artifact.triangles.byteLength + artifact.edgeMasks.byteLength;
                        log(`[${cacheLabel} surface cache] loaded modelId=${modelId} elapsed=${importElapsed.toFixed(2)} ms bytes=${artifactBytes}`);
                        log('model loaded, start rendering');
                        armPostLoadRenderTiming(modelId, totalLoadStartedAt);
                        refreshModelList();
                        refreshScalarList();
                        startRenderLoop();
                        loadSucceeded = true;
                    };
                    wasmAsyncCallActive = true;

                    try {
                        if (modelKind === 'igc' && singleFrameBenchmarkMode) {
                            log('[Benchmark] single-frame cold load reuse-cache=off current-frame-residency=1 prefetch=0 identity=verified');
                        }
                        if (modelKind === 'igc') {
                            const identityStartedAt = performance.now();
                            const inspection = await inspectIgcPackage(file);
                            packageIdentity = inspection.identity;
                            sourceIdentity = inspection.sourceIdentity;
                            const loadedModelId = singleFrameBenchmarkMode
                                ? 0
                                : api.findLoadedIgcModel(sourceIdentity);
                            log(`[File identity] format=${inspection.format} version=${inspection.version} contentId=${packageIdentity} elapsed=${(performance.now() - identityStartedAt).toFixed(2)} ms loadedModelId=${loadedModelId}`);
                            if (singleFrameBenchmarkMode) {
                                contentKey = '';
                            }
                            if (loadedModelId > 0) {
                                const loadStart = performance.now();
                                log(`[File load] reuse contentId=${packageIdentity}`);
                                const modelId = api.reuseLoadedIgcModel(sourceIdentity, replaceExisting);
                                const loadElapsed = performance.now() - loadStart;
                                if (!modelId) {
                                    throw new Error(`model reuse failed: ${api.getLastErrorJson()}`);
                                }
                                log(`[DataCodec topology timing] same-page-model-reuse=1; content-id=${packageIdentity}`);
                                log(`[File load] returned modelId=${modelId} elapsed=${loadElapsed.toFixed(2)} ms`);
                                log('model loaded, start rendering');
                                armPostLoadRenderTiming(modelId, totalLoadStartedAt);
                                refreshModelList();
                                refreshScalarList();
                                startRenderLoop();
                                loadSucceeded = true;
                                return true;
                            }
                            if (!singleFrameBenchmarkMode) {
                                contentKey = [
                                    expectedWasmBuild.buildId,
                                    expectedWasmBuild.memoryProfile,
                                    file.size,
                                    packageIdentity,
                                ].join(':');
                                const persistentArtifact = await persistentSurfaceCache.load(
                                    contentKey,
                                    packageIdentity,
                                    file.size);
                                if (persistentArtifact) {
                                    activateSurfaceArtifact(persistentArtifact, 'Persistent');
                                    return true;
                                }
                                decodeLease = await crossPageDecodeCoordinator.acquire(contentKey);
                                if (decodeLease.artifact) {
                                    activateSurfaceArtifact(decodeLease.artifact, 'Shared');
                                    return true;
                                }
                            }
                        }

                        log(`[File stage] opening path=${virtualPath}`);
                        const stageOpened = api.beginFileStage(
                            virtualPath,
                            file.size,
                            modelKind === 'igc' ? sourceIdentity : '');
                        if (!stageOpened) {
                            throw new Error(`begin failed: ${api.getLastErrorJson()}`);
                        }
                        stageCreated = true;
                        log(`[File stage] begin path=${virtualPath} size=${file.size} (${formatBytes(file.size)}) chunk=${formatBytes(chunkSize)}`);

                        while (stagedBytes < file.size) {
                            const end = Math.min(stagedBytes + chunkSize, file.size);
                            const chunkBuffer = await file.slice(stagedBytes, end).arrayBuffer();
                            const chunk = new Uint8Array(chunkBuffer);
                            if (!api.appendFileStage(chunk)) {
                                throw new Error(`append failed: ${api.getLastErrorJson()}`);
                            }

                            stagedBytes = end;
                            const progressPercent = Math.floor((stagedBytes * 100) / file.size);
                            if (progressPercent >= nextProgressPercent || stagedBytes === file.size) {
                                log(`[File stage] progress=${progressPercent}% bytes=${stagedBytes}/${file.size}`);
                                nextProgressPercent = progressPercent + 5;
                            }
                            await new Promise((resolve) => setTimeout(resolve, 0));
                        }

                        log(`[File stage] finalizing bytes=${stagedBytes}`);
                        if (!api.finishFileStage()) {
                            throw new Error(`finish failed: ${api.getLastErrorJson()}`);
                        }
                        log(`[File stage] complete bytes=${stagedBytes} (${formatBytes(stagedBytes)})`);

                        const loadStart = performance.now();
                        log(`[File load] begin path=${virtualPath}`);
                        let modelId = 0;
                        if (modelKind === 'igc') {
                            const submitted = api.startStagedIgcDecode(
                                virtualPath,
                                sourceName,
                                replaceExisting,
                                dataCodecCacheExperiment.decodedFrameCache,
                                dataCodecCacheExperiment.encodedInputCache,
                                dataCodecCacheExperiment.fullInputPrefetch);
                            if (!submitted) {
                                throw new Error(`decode submit failed: ${api.getLastErrorJson()}`);
                            }
                            let lastProgress = -1;
                            let lastText = '';
                            for (;;) {
                                await new Promise((resolve) => setTimeout(resolve, 125));
                                let status;
                                try {
                                    status = JSON.parse(api.getStagedIgcDecodeStatusJson());
                                } catch (err) {
                                    throw new Error(`decode status parse failed: ${errorText(err)}`);
                                }
                                const progressPercent = Math.floor(Math.max(0, Math.min(1, Number(status.progress) || 0)) * 100);
                                const text = String(status.text || '解码中');
                                if (progressPercent !== lastProgress || text !== lastText) {
                                    log(`[IGC decode] progress=${progressPercent}% stage=${text}`);
                                    lastProgress = progressPercent;
                                    lastText = text;
                                }
                                if (status.state === 'running') {
                                    continue;
                                }
                                if (status.state !== 'completed') {
                                    api.finishStagedIgcDecode();
                                    throw new Error(`decode failed: ${status.detail || api.getLastErrorJson()}`);
                                }
                                if (status.timing) {
                                    log(`[DataCodec topology timing] ${status.timing}`);
                                }
                                modelId = api.finishStagedIgcDecode();
                                break;
                            }
                        } else {
                            modelId = api.loadVtuFromFileEx(virtualPath, sourceName, replaceExisting);
                        }
                        const loadElapsed = performance.now() - loadStart;
                        if (!modelId) {
                            log(`[File load] failed elapsed=${loadElapsed.toFixed(2)} ms lastError=${api.getLastErrorJson()}`);
                            return false;
                        }

                        if (modelKind === 'igc' && !singleFrameBenchmarkMode && packageIdentity && contentKey) {
                            const exportStart = performance.now();
                            const exported = api.exportModelSharedSurfaceData(modelId);
                            if (!exported || !exported.positions || !exported.triangles || !exported.edgeMasks) {
                                throw new Error(
                                    `shared surface export failed: ${api.getLastErrorJson()}`);
                            }
                            sharedArtifact = {
                                version: 1,
                                positions: copyTypedArrayToCacheBuffer(exported.positions),
                                triangles: copyTypedArrayToCacheBuffer(exported.triangles),
                                edgeMasks: copyTypedArrayToCacheBuffer(exported.edgeMasks),
                            };
                            const sharedBytes = sharedArtifact.positions.byteLength +
                                sharedArtifact.triangles.byteLength +
                                sharedArtifact.edgeMasks.byteLength;
                            log(`[Shared surface cache] published bytes=${sharedBytes} elapsed=${(performance.now() - exportStart).toFixed(2)} ms points=${Number(exported.pointCount) || 0} triangles=${Number(exported.triangleCount) || 0}`);
                            const stored = await persistentSurfaceCache.store(
                                contentKey,
                                packageIdentity,
                                file.size,
                                sharedArtifact);
                            if (!stored) {
                                log('[Persistent surface cache] store rejected by policy');
                            }
                        }

                        log(`[File load] returned modelId=${modelId} elapsed=${loadElapsed.toFixed(2)} ms`);
                        log('model loaded, start rendering');
                        armPostLoadRenderTiming(modelId, totalLoadStartedAt);
                        refreshModelList();
                        refreshScalarList();
                        startRenderLoop();
                        loadSucceeded = true;
                        return true;
                    } catch (err) {
                        loadFailureDetail = errorText(err);
                        log(`[File stage] failed bytes=${stagedBytes}/${file.size} error=${loadFailureDetail}`);
                        return false;
                    } finally {
                        wasmAsyncCallActive = false;
                        if (stageCreated) {
                            try {
                                api.discardFileStage();
                            } catch (err) {
                                log(`[File stage] cleanup failed error=${errorText(err)}`);
                            }
                        }
                        if (decodeLease) {
                            decodeLease.release(loadSucceeded, loadFailureDetail, sharedArtifact);
                        }
                    }
                };

                document.getElementById('vtkFile').addEventListener('change', async (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;

                    const sourceName = file.name || 'Local model';

                    const normalizedSourceName = sourceName.toLowerCase();
                    if (normalizedSourceName.endsWith('.igc')) {
                        if (singleFrameBenchmarkMode || file.size <= stagedIgcThresholdBytes) {
                            await loadIgcBrowserFile(
                                file,
                                sourceName,
                                !singleFrameBenchmarkMode);
                        } else {
                            await loadLargeStagedFile(file, sourceName, 'igc');
                        }
                        e.target.value = '';
                        return;
                    }
                    if (file.size > maxDirectFileBytes && normalizedSourceName.endsWith('.vtu')) {
                        await loadLargeStagedFile(
                            file,
                            sourceName,
                            'vtu');
                        e.target.value = '';
                        return;
                    }

                    try {
                        const buf = await file.arrayBuffer();
                        await loadModelBuffer(buf, sourceName);
                    } catch (err) {
                        log(`[File read] failed name=${sourceName} error=${errorText(err)}`);
                        e.target.value = '';
                    }
                });

                const startRenderLoop = () => {
                    if (viewerDestroyed || renderLoopStarted) {
                        return;
                    }

                    renderLoopStarted = true;
                    const loop = () => {
                        if (viewerDestroyed || !renderLoopStarted) {
                            renderLoopStarted = false;
                            return;
                        }
                        if (wasmAsyncCallActive) {
                            requestAnimationFrame(loop);
                            return;
                        }
                        try {
                            const timing = postLoadRenderTiming;
                            const frameStart = performance.now();
                            api.renderFrame();
                            const frameMs = performance.now() - frameStart;
                            interactionRenderStats.record(frameMs);
                            if (timing !== null && timing === postLoadRenderTiming) {
                                const totalMs = performance.now() - timing.startedAt;
                                const totalFromSelectionMs = timing.requestStartedAt === null
                                    ? null
                                    : performance.now() - timing.requestStartedAt;
                                log(`[First render timing] modelId=${timing.modelId} renderFrame=${frameMs.toFixed(2)} ms total-after-load=${totalMs.toFixed(2)} ms total-from-selection=${totalFromSelectionMs === null ? 'n/a' : totalFromSelectionMs.toFixed(2)} ms refreshModelList=${timing.refreshModelListMs === null ? 'n/a' : timing.refreshModelListMs.toFixed(2)} ms refreshScalarList=${timing.refreshScalarListMs === null ? 'n/a' : timing.refreshScalarListMs.toFixed(2)} ms`);
                                postLoadRenderTiming = null;
                            }
                        } catch (err) {
                            log(`render exception: ${err && err.stack ? err.stack : err}`);
                            renderLoopStarted = false;
                            return;
                        }
                        requestAnimationFrame(loop);
                    };
                    requestAnimationFrame(loop);
                };

                const loadModelBuffer = async (buf, sourceName) => {
                    const data = new Uint8Array(buf);
                    const normalizeModelName = (value) => {
                        const rawName = String(value || '');
                        const withoutQuery = rawName.split(/[?#]/, 1)[0];
                        const slashIndex = Math.max(withoutQuery.lastIndexOf('/'), withoutQuery.lastIndexOf('\\'));
                        return slashIndex >= 0 ? withoutQuery.slice(slashIndex + 1) : withoutQuery;
                    };

                    const detectModelKind = () => {
                        const normalizedName = normalizeModelName(sourceName).toLowerCase();
                        if (normalizedName.endsWith('.zip')) return 'zip';
                        if (normalizedName.endsWith('.igc')) return 'igc';
                        if (normalizedName.endsWith('.vtp')) return 'vtp';
                        if (normalizedName.endsWith('.vtu')) return 'vtu';
                        if (normalizedName.endsWith('.vtk')) return 'vtk';

                        if (data.byteLength >= 4) {
                            const magic = Array.from(data.subarray(0, 4));
                            if (magic[0] === 0x50 && magic[1] === 0x4b) {
                                return 'zip';
                            }
                        }

                        const previewLength = Math.min(data.byteLength, 2048);
                        const previewText = new TextDecoder('utf-8', { fatal: false }).decode(data.subarray(0, previewLength));
                        if (previewText.includes('type="PolyData"') || previewText.includes('<PolyData')) return 'vtp';
                        if (previewText.includes('type="UnstructuredGrid"') || previewText.includes('<UnstructuredGrid')) return 'vtu';
                        return 'vtk';
                    };

                    let loadedResult = 0;
                    let modelKind = 'vtk';
                    let igcTimingStart = 0;
                    let igcTimingAfterLoad = 0;
                    let shouldReportIgcTiming = false;
                    try {
                        const mode = document.getElementById('importMode').value;
                        const replaceExisting = mode === 'replace' ? 1 : 0;
                        modelKind = detectModelKind();
                        const fallbackName = modelKind === 'zip'
                            ? 'Imported ZIP'
                            : (modelKind === 'igc'
                                ? 'Imported IGC'
                                : (modelKind === 'vtp' ? 'Imported VTP' : (modelKind === 'vtu' ? 'Imported VTU' : 'Imported VTK')));

                        if (modelKind === 'zip') {
                            loadedResult = api.loadZipFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        } else if (modelKind === 'igc') {
                            log('IGC is a compact format that may not support all VTK features; for best compatibility, please upload as ZIP package with .igc files.');
                            shouldReportIgcTiming = true;
                            igcTimingStart = performance.now();
                            loadedResult = api.loadIgcFromMemory(data, sourceName || fallbackName, replaceExisting !== 0);
                            igcTimingAfterLoad = performance.now();
                        } else if (modelKind === 'vtp') {
                            loadedResult = api.loadVtpFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        } else if (modelKind === 'vtu') {
                            loadedResult = api.loadVtuFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        } else {
                            loadedResult = api.loadVtkFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        }
                    } catch (err) {
                        log(`load exception: ${err && err.stack ? err.stack : err}`);
                    }

                    if (!loadedResult) {
                        log('load model failed (.vtk/.vtu/.vtp/.igc package .zip)');
                        return false;
                    }

                    if (modelKind === 'zip') {
                        log(`load returned loadedCount=${loadedResult}`);
                    } else {
                        log(`load returned modelId=${loadedResult}`);
                    }
                    log('model loaded, start rendering');
                    refreshModelList();
                    refreshScalarList();
                    if (shouldReportIgcTiming) {
                        const renderStart = performance.now();
                        api.renderFrame();
                        const renderEnd = performance.now();
                        log(`[IGC timing] renderFrame=${(renderEnd - renderStart).toFixed(2)} ms`);
                        await new Promise((resolve) => requestAnimationFrame(resolve));
                        const igcTimingAfterRender = performance.now();
                        log(`[IGC timing] load/decode/add=${(igcTimingAfterLoad - igcTimingStart).toFixed(2)} ms, load-to-render=${(igcTimingAfterRender - igcTimingStart).toFixed(2)} ms`);
                    }
                    startRenderLoop();
                    return true;
                };

                const igcSeries = {
                    frames: [],
                    currentIndex: -1,
                    playing: false,
                    playTimer: null,
                    requestController: null,
                    requestSerial: 0,
                };

                const setIgcSeriesStatus = (text) => {
                    document.getElementById('igcSeriesStatus').textContent = text;
                };

                const stopIgcSeries = () => {
                    igcSeries.playing = false;
                    if (igcSeries.playTimer !== null) {
                        clearTimeout(igcSeries.playTimer);
                        igcSeries.playTimer = null;
                    }
                    document.getElementById('btnPlayIgcSeries').textContent = 'Play';
                };

                const requestIgcSeriesManifest = async () => {
                    const response = await fetch('/api/series/comp/manifest', { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`manifest request failed: HTTP ${response.status}`);
                    }
                    const manifest = await response.json();
                    if (!manifest || !Array.isArray(manifest.frames) || manifest.frames.length === 0) {
                        throw new Error('manifest contains no frames');
                    }
                    igcSeries.frames = manifest.frames.slice().sort((lhs, rhs) => lhs.index - rhs.index);
                    return igcSeries.frames;
                };

                const showIgcSeriesFrame = async (requestedIndex) => {
                    if (igcSeries.frames.length === 0) {
                        await requestIgcSeriesManifest();
                    }
                    const frameCount = igcSeries.frames.length;
                    const index = (requestedIndex + frameCount) % frameCount;
                    const frame = igcSeries.frames[index];
                    const requestSerial = ++igcSeries.requestSerial;

                    if (igcSeries.requestController) {
                        igcSeries.requestController.abort();
                    }
                    igcSeries.requestController = new AbortController();

                    try {
                        // This low-memory demo intentionally releases the previous decoded model first.
                        api.removeAllModels();
                        refreshModelList();
                        refreshScalarList();
                        setIgcSeriesStatus(`Loading ${frame.name}...`);
                        log(`IGC series requesting frame ${index + 1}/${frameCount}: ${frame.name}`);

                        const response = await fetch(frame.url, {
                            cache: 'no-store',
                            signal: igcSeries.requestController.signal,
                        });
                        if (!response.ok) {
                            throw new Error(`frame request failed: HTTP ${response.status}`);
                        }
                        const frameBlob = await response.blob();
                        if (requestSerial !== igcSeries.requestSerial) {
                            return false;
                        }

                        const frameFile = new File(
                            [frameBlob],
                            frame.name,
                            { type: frameBlob.type || 'application/octet-stream' });
                        const loaded = singleFrameBenchmarkMode || frameFile.size <= stagedIgcThresholdBytes
                            ? await loadIgcBrowserFile(
                                  frameFile,
                                  frame.name,
                                  !singleFrameBenchmarkMode)
                            : await loadLargeStagedFile(frameFile, frame.name, 'igc');
                        if (!loaded) {
                            throw new Error(`browser file decode failed: ${api.getLastErrorJson()}`);
                        }
                        startRenderLoop();
                        api.renderFrame();
                        igcSeries.currentIndex = index;
                        refreshModelList();
                        refreshScalarList();
                        setIgcSeriesStatus(`Frame ${index + 1}/${frameCount}: ${frame.name}`);
                        log(`IGC series displayed frame ${index + 1}/${frameCount}: ${frame.name}`);
                        return true;
                    } catch (err) {
                        if (err && err.name === 'AbortError') {
                            return false;
                        }
                        stopIgcSeries();
                        setIgcSeriesStatus('Load failed');
                        log(`IGC series exception: ${err && err.stack ? err.stack : err}`);
                        return false;
                    }
                };

                const scheduleNextIgcFrame = () => {
                    if (!igcSeries.playing) return;
                    igcSeries.playTimer = setTimeout(async () => {
                        const nextIndex = igcSeries.currentIndex < 0 ? 0 : igcSeries.currentIndex + 1;
                        await showIgcSeriesFrame(nextIndex);
                        scheduleNextIgcFrame();
                    }, 1000);
                };

                document.getElementById('btnLoadIgcSeries').addEventListener('click', async () => {
                    try {
                        stopIgcSeries();
                        await requestIgcSeriesManifest();
                        log(`IGC series manifest loaded: ${igcSeries.frames.map((frame) => frame.name).join(', ')}`);
                        await showIgcSeriesFrame(0);
                    } catch (err) {
                        setIgcSeriesStatus('Manifest failed');
                        log(`IGC manifest exception: ${err && err.stack ? err.stack : err}`);
                    }
                });

                document.getElementById('btnPreviousIgcFrame').addEventListener('click', async () => {
                    stopIgcSeries();
                    await showIgcSeriesFrame(igcSeries.currentIndex <= 0 ? igcSeries.frames.length - 1 : igcSeries.currentIndex - 1);
                });

                document.getElementById('btnNextIgcFrame').addEventListener('click', async () => {
                    stopIgcSeries();
                    await showIgcSeriesFrame(igcSeries.currentIndex + 1);
                });

                document.getElementById('btnPlayIgcSeries').addEventListener('click', async () => {
                    if (igcSeries.playing) {
                        stopIgcSeries();
                        return;
                    }
                    if (igcSeries.currentIndex < 0) {
                        await showIgcSeriesFrame(0);
                    }
                    igcSeries.playing = true;
                    document.getElementById('btnPlayIgcSeries').textContent = 'Pause';
                    scheduleNextIgcFrame();
                });

                document.getElementById('btnLoadFromServer').addEventListener('click', async () => {
                    try {
                        log('Fetching remote model list...');
                        // 1. 先获取模型列表
                        const listResp = await fetch('/api/models');
                        if (!listResp.ok) {
                            log(`Failed to fetch model list: HTTP ${listResp.status}`);
                            return;
                        }
                        const listData = await listResp.json();
                        const items = listData.items || [];
                        if (items.length === 0) {
                            log('No models available on server');
                            return;
                        }

                        // 2. 简单起见，直接加载第一个模型（你可以改为让用户在下拉框中选择）
                        const model = items[0];
                        log(`Loading remote model: ${model.name} (${model.id})`);

                        const fileResp = await fetch(`/api/models/${encodeURIComponent(model.id)}/file`);
                        if (!fileResp.ok) {
                            log(`Failed to download model file: HTTP ${fileResp.status}`);
                            return;
                        }

                        const sourceName = fileResp.headers.get('X-Model-Name') || model.name;
                        if (String(sourceName).toLowerCase().endsWith('.igc')) {
                            const remoteSize = Number(fileResp.headers.get('Content-Length') || 0);
                            if (remoteSize > stagedIgcThresholdBytes &&
                                fileResp.body &&
                                navigator.storage &&
                                typeof navigator.storage.getDirectory === 'function') {
                                const remoteStageStartedAt = performance.now();
                                const root = await navigator.storage.getDirectory();
                                const stagedName = `igame-remote-${Date.now()}-${sourceName}`;
                                const handle = await root.getFileHandle(stagedName, { create: true });
                                const writable = await handle.createWritable();
                                const reader = fileResp.body.getReader();
                                let receivedBytes = 0;
                                let lastLoggedPercent = -1;
                                try {
                                    for (;;) {
                                        const { done, value } = await reader.read();
                                        if (done) break;
                                        await writable.write(value);
                                        receivedBytes += value.byteLength;
                                        const percent = Math.floor((receivedBytes * 100) / remoteSize);
                                        if (percent >= lastLoggedPercent + 10 || receivedBytes === remoteSize) {
                                            lastLoggedPercent = percent;
                                            log(`[Remote stage] progress=${Math.min(100, percent)}% bytes=${receivedBytes}/${remoteSize}`);
                                        }
                                    }
                                    await writable.close();
                                    if (receivedBytes !== remoteSize) {
                                        throw new Error(`remote byte count mismatch expected=${remoteSize} actual=${receivedBytes}`);
                                    }
                                    const modelFile = await handle.getFile();
                                    log(`[Remote stage] complete elapsed=${(performance.now() - remoteStageStartedAt).toFixed(2)} ms bytes=${receivedBytes}`);
                                    if (singleFrameBenchmarkMode) {
                                        await loadIgcBrowserFile(modelFile, sourceName, false);
                                    } else {
                                        await loadLargeStagedFile(modelFile, sourceName, 'igc');
                                    }
                                } finally {
                                    try { reader.releaseLock(); } catch (_) {}
                                    try { await writable.abort(); } catch (_) {}
                                    if (!singleFrameBenchmarkMode) {
                                        try { await root.removeEntry(stagedName); } catch (_) {}
                                    }
                                }
                            } else {
                                const modelBlob = await fileResp.blob();
                                const modelFile = new File(
                                    [modelBlob],
                                    sourceName,
                                    { type: modelBlob.type || 'application/octet-stream' });
                                if (singleFrameBenchmarkMode || modelFile.size <= stagedIgcThresholdBytes) {
                                    await loadIgcBrowserFile(
                                        modelFile,
                                        sourceName,
                                        !singleFrameBenchmarkMode);
                                } else {
                                    await loadLargeStagedFile(modelFile, sourceName, 'igc');
                                }
                            }
                        } else {
                            const buf = await fileResp.arrayBuffer();
                            await loadModelBuffer(buf, sourceName);
                        }
                    } catch (err) {
                        log(`remote model load exception: ${err && err.stack ? err.stack : err}`);
                    }
                });

            }
        };
    </script>
    <script>
        var Module = Module || {};
        const igameWasmAssetVersion = '@IGAME_WASM_BUILD_ID@-@IGAME_WASM_MEMORY_PROFILE@';
        Module.locateFile = function (path, prefix) {
            if (path.endsWith('.wasm')) {
                return `@IGAME_WASM_WASM_NAME@?build=${encodeURIComponent(igameWasmAssetVersion)}`;
            }
            if (path.endsWith('.worker.js')) {
                return `${prefix}${path}?build=${encodeURIComponent(igameWasmAssetVersion)}`;
            }
            return prefix + path;
        };
    </script>
    <script src="@IGAME_WASM_JS_NAME@?build=@IGAME_WASM_BUILD_ID@-@IGAME_WASM_MEMORY_PROFILE@"></script>
</body>

</html>
