<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>iGameVis Version.Web</title>
    <style>
        :root {
            --bg: #eef3f8;
            --card: #ffffff;
            --surface: #f7fafc;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #0f7490;
            --accent-hover: #0b6078;
            --line: #d8e2ec;
            --line-soft: #e8eef5;
            --focus: rgba(15, 116, 144, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(186, 230, 253, 0.65), transparent 34%),
                radial-gradient(circle at 88% 4%, rgba(204, 251, 241, 0.5), transparent 28%),
                var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 1520px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 18px 48px rgba(30, 64, 96, 0.1);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line-soft);
        }

        .app-header h2 {
            margin: 0;
            font-size: clamp(22px, 3vw, 30px);
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(330px, 390px);
            gap: 18px;
            align-items: start;
        }

        .viewer-column {
            min-width: 0;
        }

        .viewer-heading,
        .tool-dock-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 38px;
            margin-bottom: 10px;
        }

        .viewer-heading h3,
        .tool-dock-header h3 {
            margin: 0;
            font-size: 15px;
        }

        .viewer-heading span,
        .tool-dock-header span {
            color: var(--muted);
            font-size: 12px;
        }

        #canvas {
            width: 100%;
            height: calc(100vh - 172px);
            min-height: 560px;
            border: 0;
            border-radius: 10px;
            background: #0b0f14;
            display: block;
        }

        .viewer-shell {
            position: relative;
            margin-top: 0;
            padding: 6px;
            border: 1px solid #172433;
            border-radius: 14px;
            background: #111a24;
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.18);
        }

        .viewer-shell #canvas {
            margin-top: 0;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
        }

        .build-marker {
            display: inline-flex;
            align-items: center;
            margin: 0;
            padding: 6px 10px;
            border: 1px solid #a7f3d0;
            border-radius: 999px;
            background: #ecfdf5;
            color: #047857;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 1px solid rgba(6, 78, 99, 0.18);
            border-radius: 8px;
            background: linear-gradient(180deg, #1683a0, var(--accent));
            color: #fff;
            padding: 9px 13px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.15;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(15, 116, 144, 0.16);
            transition: background 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
        }

        button:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 10px rgba(15, 116, 144, 0.22);
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        summary:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        select,
        input[type="text"],
        input[type="number"] {
            height: 36px;
            border: 1px solid #cbd7e4;
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            padding: 0 10px;
        }

        select:hover,
        input[type="text"]:hover,
        input[type="number"]:hover {
            border-color: #9fb3c8;
        }

        input[type="file"] {
            max-width: 290px;
            border: 1px dashed #b8c8d9;
            border-radius: 8px;
            background: #fff;
            color: var(--muted);
            padding: 4px;
            font-size: 13px;
        }

        input[type="file"]::file-selector-button {
            margin-right: 8px;
            border: 0;
            border-radius: 6px;
            background: #e7f3f7;
            color: #075b72;
            padding: 6px 10px;
            font-weight: 600;
            cursor: pointer;
        }

        input[type="checkbox"],
        input[type="radio"],
        input[type="range"] {
            accent-color: var(--accent);
        }

        input[type="color"] {
            width: 42px;
            height: 36px;
            border: 1px solid #cbd7e4;
            border-radius: 8px;
            background: #fff;
            padding: 3px;
            cursor: pointer;
        }

        .tool-section-body>.row>span {
            border-radius: 999px;
            background: #edf2f7;
            padding: 5px 9px;
        }

        .tool-dock {
            min-width: 0;
            max-height: calc(100vh - 112px);
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-color: #b8c8d9 transparent;
            scrollbar-width: thin;
        }

        details.tool-section {
            margin-bottom: 8px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            overflow: hidden;
        }

        details.tool-section>summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
            user-select: none;
        }

        details.tool-section>summary::-webkit-details-marker {
            display: none;
        }

        details.tool-section>summary::after {
            content: "+";
            flex: 0 0 auto;
            color: var(--accent);
            font-size: 19px;
            font-weight: 500;
            line-height: 1;
        }

        details.tool-section[open]>summary {
            background: #eef6f9;
            border-bottom: 1px solid var(--line);
            color: #075b72;
        }

        details.tool-section[open]>summary::after {
            content: "−";
        }

        .tool-section-body {
            padding: 12px;
        }

        .tool-section-body>.row {
            gap: 8px;
            margin-top: 0 !important;
            padding: 0 0 12px;
            border-bottom: 1px solid var(--line-soft);
        }

        .tool-section-body>.row+.row {
            margin-top: 12px !important;
        }

        .tool-section-body>.row:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }

        .tool-dock #modelList,
        .tool-dock #annotationText,
        .tool-dock #scalarSelect {
            width: 100%;
            min-width: 0 !important;
        }

        .tool-dock #color_canvas,
        .tool-dock #color_jsonOut {
            width: 100% !important;
            max-width: 100%;
        }

        details.color-map-panel {
            margin-top: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            overflow: hidden;
        }

        details.color-map-panel>summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 600;
            color: var(--text);
            background: linear-gradient(180deg, #f7fbff, #eef5fc);
            border-bottom: 1px solid var(--line);
        }

        details.color-map-panel>summary::after {
            content: "+";
            float: right;
            color: var(--accent);
            font-size: 18px;
            line-height: 1;
        }

        details.color-map-panel[open]>summary::after {
            content: "−";
        }

        details.color-map-panel>summary::-webkit-details-marker {
            display: none;
        }

        .color-map-body {
            padding: 14px;
        }

        .range-panel {
            margin-top: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            background: var(--surface);
        }

        .range-panel h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        @media (max-width: 1050px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .tool-dock {
                max-height: none;
                overflow: visible;
                padding-right: 0;
            }

            #canvas {
                height: 62vh;
                min-height: 440px;
            }
        }

        @media (max-width: 760px) {
            .wrap {
                margin: 12px auto;
                padding: 0 10px;
            }

            .card {
                padding: 14px;
                border-radius: 12px;
            }

            .app-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .viewer-heading,
            .tool-dock-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 3px;
            }

            #modelList,
            #annotationText,
            #scalarSelect {
                min-width: 100% !important;
                width: 100%;
            }

            #canvas {
                height: 56vh;
                min-height: 360px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <div class="app-header">
                <h2>iGameVis Version.Web</h2>
                <div class="build-marker">Build marker: 2026-06-13_V1</div>
            </div>
            <div class="workspace">
                <section class="viewer-column" aria-label="模型显示区">
                    <div class="viewer-heading">
                        <h3>模型显示</h3>
                        <span>拖动旋转 · 滚轮缩放</span>
                    </div>
                    <div id="viewerShell" class="viewer-shell">
                        <canvas id="canvas"></canvas>
                    </div>
                </section>

                <aside class="tool-dock" aria-label="功能工具栏">
                    <div class="tool-dock-header">
                        <h3>功能工具</h3>
                        <span>点击分类展开或收起</span>
                    </div>

                    <details class="tool-section" open>
                        <summary>文件导入</summary>
                        <div class="tool-section-body">
                            <div class="row">
                                <input id="vtkFile" type="file" accept=".vtk,.vtu,.vtp,.igc,.igcm,.zip" />
                                <button id="btnLoadFromServer" type="button">Load From Server</button>
                                <button id="btnRaiseTestError" type="button">Raise Test Error</button>
                                <label>Import</label>
                                <select id="importMode">
                                    <option value="append" selected>Append</option>
                                    <option value="replace">Replace</option>
                                </select>
                            </div>
                        </div>
                    </details>

                    <details class="tool-section">
                        <summary>时序数据</summary>
                        <div class="tool-section-body">
                            <div class="row">
                                <label>IGC Time Series</label>
                                <button id="btnLoadIgcSeries" type="button">Load comp Series</button>
                                <button id="btnPreviousIgcFrame" type="button">Previous Frame</button>
                                <button id="btnNextIgcFrame" type="button">Next Frame</button>
                                <button id="btnPlayIgcSeries" type="button">Play</button>
                                <span id="igcSeriesStatus" style="font-size: 13px; color: #4b5563;">Not loaded</span>
                            </div>
                        </div>
                    </details>

                    <details class="tool-section">
                        <summary>模型管理</summary>
                        <div class="tool-section-body">
            <div class="row" style="margin-top: 10px;">
                <label>Models</label>
                <select id="modelList" style="min-width: 360px;"></select>
                <button id="btnRefreshModels" type="button">Refresh Models</button>
                <button id="btnSetActiveModel" type="button">Set Active</button>
                <button id="btnToggleModelVisibility" type="button">Toggle Visible</button>
                <button id="btnRemoveModel" type="button">Remove</button>
                <button id="btnRemoveAllModels" type="button">Remove All</button>
                <button id="btnClearViewer" type="button">Clear Viewer</button>
            </div>
            <div class="row" style="margin-top: 10px;">
                <label>Lifecycle</label>
                <button id="btnDestroyViewer" type="button">Destroy Viewer</button>
                <button id="btnReinitViewer" type="button">Destroy + Init</button>
                <span id="lifecycleStatus" style="font-size: 13px; color: #4b5563;">Ready</span>
            </div>
                        </div>
                    </details>

                    <details class="tool-section">
                        <summary>选择与切片</summary>
                        <div class="tool-section-body">
            <div class="row" style="margin-top: 10px;">
                <label>Selection</label>
                <button id="btnSelectionBrowse" type="button">Browse</button>
                <button id="btnSelectionPoint" type="button">Point</button>
                <button id="btnSelectionFace" type="button">Face</button>
                <button id="btnClearSelection" type="button">Clear Selection</button>
                <button id="btnReadSelection" type="button">Read Selection</button>
                <span id="selectionResult" style="font-size: 13px; color: #4b5563;">Mode: Browse</span>
            </div>
            <div class="row" style="margin-top: 10px;">
                <label>Mesh Slice</label>
                <button id="btnEnterSlicing" type="button">Enter Slicing</button>
                <button id="btnExitSlicing" type="button">Exit Slicing</button>
                <button id="btnExecuteSlice" type="button">Execute</button>
                <button id="btnApplyClipPlane" type="button">Apply Plane</button>
                <label><input id="sliceModeSlice" name="sliceOperationMode" type="radio" value="0" checked />
                    Slice</label>
                <label><input id="sliceModeClip" name="sliceOperationMode" type="radio" value="1" /> Clip</label>
                <label><input id="slicePreview" type="checkbox" /> Preview</label>
                <label><input id="sliceCrinkle" type="checkbox" /> Crinkle</label>
                <label><input id="sliceInvert" type="checkbox" checked /> Invert</label>
            </div>
            <div class="row" style="margin-top: 8px;">
                <label>Origin</label>
                <input id="clipOriginX" type="text" value="0" style="width: 72px;" />
                <input id="clipOriginY" type="text" value="0" style="width: 72px;" />
                <input id="clipOriginZ" type="text" value="0" style="width: 72px;" />
                <label>Normal</label>
                <input id="clipNormalX" type="text" value="1" style="width: 72px;" />
                <input id="clipNormalY" type="text" value="0" style="width: 72px;" />
                <input id="clipNormalZ" type="text" value="0" style="width: 72px;" />
                <span id="sliceStatus" style="font-size: 13px; color: #4b5563;">Slice: inactive</span>
            </div>
                        </div>
                    </details>

                    <details class="tool-section">
                        <summary>相机与外观</summary>
                        <div class="tool-section-body">
            <div class="row">
                <button id="btnReset" type="button">Reset Camera</button>
                <label>Camera Type</label>
                <select id="cameraType">
                    <option value="0" selected>Perspective</option>
                    <option value="1">Orthographic</option>
                </select>
                <button id="btnApplyCameraType" type="button">Apply Camera Type</button>
            </div>
            <div class="row" style="margin-top: 10px;">
                <label>Camera Views</label>
                <button id="btnViewXPlus" type="button">X+</button>
                <button id="btnViewXMinus" type="button">X-</button>
                <button id="btnViewYPlus" type="button">Y+</button>
                <button id="btnViewYMinus" type="button">Y-</button>
                <button id="btnViewZPlus" type="button">Z+</button>
                <button id="btnViewZMinus" type="button">Z-</button>
                <button id="btnViewIso" type="button">Iso</button>
                <button id="btnZoomIn" type="button">Zoom In</button>
                <button id="btnZoomOut" type="button">Zoom Out</button>
                <label><input id="axesVisible" type="checkbox" checked /> Axes</label>
                <label><input id="colorBarVisible" type="checkbox" checked /> ColorBar</label>
            </div>
            <div class="row" style="margin-top: 10px;">
                <label>Model ID</label>
                <input id="viewStyleModelId" type="number" min="0" step="1" value="0" style="width: 120px;" />
                <label>View</label>
                <select id="viewStyle">
                    <option value="1">Points</option>
                    <option value="4">Surface</option>
                    <option value="2">Wireframe</option>
                    <option value="6" selected>Surface + Wireframe</option>
                    <option value="7">Points + Wireframe + Surface</option>
                </select>
                <button id="btnApplyView" type="button">Apply View</button>
                <button id="btnReadView" type="button">Read Current View</button>
                <span id="viewStyleText" style="font-size: 13px; color: #4b5563;"></span>

                <label>Shading</label>
                <select id="shadingMode">
                    <option value="0" selected>BlinnPhong</option>
                    <option value="1">NoLight</option>
                </select>
                <button id="btnApplyShading" type="button">Apply Shading</button>

                <label>Background</label>
                <input id="bgColor" type="color" value="#222222" />
                <button id="btnApplyBg" type="button">Apply Background</button>

                <label>Default Color</label>
                <input id="defaultColor" type="color" value="#d9d9d9" />
                <button id="btnApplyDefaultColor" type="button">Apply Default Color</button>
                <button id="btnReadDefaultColor" type="button">Read Default Color</button>
                <span style="font-size: 12px; color: #6b7280;">仅在未开启颜色映射时生效</span>
            </div>
            <div class="row" style="margin-top: 10px;">
                <label>Opacity</label>
                <input id="actorOpacity" type="range" min="0.05" max="1" step="0.05" value="1" />
                <span id="actorOpacityText" style="font-size: 13px; color: #4b5563;">1.00</span>
                <button id="btnApplyOpacity" type="button">Apply Opacity</button>
                <button id="btnReadOpacity" type="button">Read Opacity</button>
                <label>Solid Color</label>
                <input id="solidColor" type="color" value="#d9d9d9" />
                <button id="btnApplySolidColor" type="button">Apply Solid Color</button>
                <button id="btnReadSolidColor" type="button">Read Solid Color</button>
                <label>Gradient</label>
                <input id="bgColor2" type="color" value="#0b0f14" />
                <select id="bgGradient">
                    <option value="solid" selected>Solid</option>
                    <option value="vertical">Vertical</option>
                    <option value="horizontal">Horizontal</option>
                </select>
                <button id="btnApplyGradientBg" type="button">Apply Gradient Example</button>
            </div>
            <div class="row" style="margin-top: 10px;">
                <label>Corner Annotation</label>
                <input id="annotationText" type="text" value="iGameVis WASM" style="min-width: 260px;" />
                <button id="btnApplyAnnotation" type="button">Apply Annotation</button>
            </div>
                        </div>
                    </details>

                    <details class="tool-section">
                        <summary>标量与颜色</summary>
                        <div class="tool-section-body">
            <div class="row" style="margin-top: 10px;">
                <label>Scalar</label>
                <select id="scalarSelect" style="min-width: 260px;">
                    <option value="-1" selected>None</option>
                </select>
                <button id="btnRefreshScalarList" type="button">Refresh Scalar List</button>
                <label>Dimension</label>
                <select id="scalarDimSelect" style="min-width: 120px;">
                    <option value="-1" selected>Auto (-1)</option>
                </select>
                <label>Attachment</label>
                <select id="scalarAttachment">
                    <option value="-1" selected>Any</option>
                    <option value="0">PointData</option>
                    <option value="1">CellData</option>
                </select>
                <button id="btnApplyScalar" type="button">Apply Scalar</button>
            </div>

            <details class="color-map-panel">
                <summary>ColorMap 编辑器</summary>
                <div class="color-map-body">
                    <div class="row" style="margin-bottom: 6px;">
                        <button id="color_btnDefault" type="button">示例节点</button>
                        <button id="color_btnAdd" type="button">添加节点</button>
                        <button id="color_btnApply" type="button">应用到 WASM</button>
                        <button id="color_btnGet" type="button">读取 WASM 映射</button>
                    </div>
                    <div id="color_nodes" style="margin-bottom:8px;"></div>
                    <canvas id="color_canvas" width="420" height="40"
                        style="border:1px solid var(--line); display:block; margin-bottom:8px;"></canvas>
                    <div id="color_jsonOut"
                        style="width:420px; height:120px; white-space:pre-wrap; overflow:auto; border:1px solid #eee; padding:6px; background:#fafafa;">
                        {}</div>
                </div>
            </details>
            <div class="range-panel">
                <h3 style="margin:0 0 8px 0; font-size:15px;">Range API Verification</h3>
                <div style="margin-bottom:8px;">
                    <label>Scalar Name</label>
                    <input id="rangeScalar" type="text" value="Temperature" style="margin-left:8px;" />
                </div>
                <div class="row" style="margin-bottom:8px;">
                    <input id="rangeComponent" type="number" step="1" value="0" aria-label="component"
                        style="width:120px;" />
                    <input id="rangeMin" type="number" step="0.1" value="0" aria-label="min" style="width:120px;" />
                    <input id="rangeMax" type="number" step="0.1" value="100" aria-label="max" style="width:120px;" />
                </div>
                <div class="row">
                    <button id="rangeApply" type="button">Apply Range API</button>
                    <button id="rangeRead" type="button">Read Back JSON</button>
                    <button id="rangeDebugSequence" type="button">Debug 0-1/0-100/0-1</button>
                </div>
            </div>
                        </div>
                    </details>
                </aside>
            </div>
        </div>
    </div>

    <script>
        const log = (msg) => {
            const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
            console.log(line);
        };
        let renderLoopStarted = false;
        let viewerDestroyed = false;
        const interactionRenderStats = {
            active: false,
            type: '',
            samples: [],
            startedAt: 0,
            wheelTimer: null,

            begin(type) {
                if (this.active && this.type === type) {
                    return;
                }
                if (this.active) {
                    this.end('switch');
                }
                if (this.wheelTimer !== null) {
                    clearTimeout(this.wheelTimer);
                    this.wheelTimer = null;
                }
                this.active = true;
                this.type = type;
                this.samples = [];
                this.startedAt = performance.now();
            },

            record(ms) {
                if (!this.active || !Number.isFinite(ms)) {
                    return;
                }
                this.samples.push(ms);
            },

            end(reason) {
                if (!this.active) {
                    return;
                }
                if (this.wheelTimer !== null) {
                    clearTimeout(this.wheelTimer);
                    this.wheelTimer = null;
                }

                const type = this.type;
                const samples = this.samples.slice();
                this.active = false;
                this.type = '';
                this.samples = [];
                this.startedAt = 0;

                if (samples.length === 0) {
                    return;
                }

                samples.sort((a, b) => a - b);
                const sum = samples.reduce((acc, value) => acc + value, 0);
                const percentile = (p) => {
                    const index = Math.min(samples.length - 1, Math.floor((samples.length - 1) * p));
                    return samples[index];
                };
                const over16 = samples.filter((value) => value > 16.7).length;
                const over33 = samples.filter((value) => value > 33.3).length;
                const avg = sum / samples.length;
                const max = samples[samples.length - 1];

                log(`[Render timing interaction] type=${type} frames=${samples.length} avg=${avg.toFixed(2)} ms p50=${percentile(0.5).toFixed(2)} ms p95=${percentile(0.95).toFixed(2)} ms max=${max.toFixed(2)} ms over16.7=${over16} over33.3=${over33}`);
            },

                if (this.wheelTimer !== null) {

                    this.end('wheel-idle');

                function hexToRgb01(hex) {
                    if (hex.startsWith('#')) hex = hex.slice(1);
                    const bigint = parseInt(hex, 16);
                    const r = (bigint >> 16) & 255;
                    const g = (bigint >> 8) & 255;
                    const b = bigint & 255;
                    return [r / 255, g / 255, b / 255];
                }
                function rgb01ToHex(r, g, b) {
                    const toHex = v => {
                        const n = Math.round(Math.max(0, Math.min(1, v)) * 255);
                        return ('0' + n.toString(16)).slice(-2);
                    };
                    return '#' + toHex(r) + toHex(g) + toHex(b);
                }

                function addColorNode(hex = '#000000', pos = 0.0) {
                    const div = document.createElement('div');
                    div.className = 'color-node';
                    div.style.display = 'flex';
                    div.style.gap = '8px';
                    div.style.alignItems = 'center';
                    div.style.marginBottom = '6px';
                    div.innerHTML = `<input type="color" class="color" value="${hex}"/>` +
                        `<input type="number" class="pos" min="0" max="1" step="0.001" value="${pos}" style="width:80px;"/>` +
                        `<button class="remove">删除</button>`;
                    colorNodesEl.appendChild(div);
                    div.querySelector('.remove').onclick = () => { div.remove(); renderColorEditor(); };
                    div.querySelector('.color').oninput = renderColorEditor;
                    div.querySelector('.pos').oninput = renderColorEditor;
                    renderColorEditor();
                }

                function clearColorNodes() { colorNodesEl.innerHTML = ''; }

                function readColorNodes() {
                    const rows = Array.from(colorNodesEl.querySelectorAll('.color-node'));
                    const items = rows.map(r => {
                        const hex = r.querySelector('.color').value;
                        const pos = parseFloat(r.querySelector('.pos').value) || 0.0;
                        return { hex, pos };
                    });
                    items.sort((a, b) => a.pos - b.pos);
                    return items;
                }

                function renderColorEditor() {
                    const items = readColorNodes();
                    if (items.length === 0) { colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height); return; }
                    const grad = colorCtx.createLinearGradient(0, 0, colorCanvas.width, 0);
                    const min = items[0].pos, max = items[items.length - 1].pos;
                    const range = Math.max(1e-6, max - min);
                    items.forEach(it => {
                        const rgb = hexToRgb01(it.hex);
                        const color = `rgb(${Math.round(rgb[0] * 255)},${Math.round(rgb[1] * 255)},${Math.round(rgb[2] * 255)})`;
                        const t = (it.pos - min) / range;
                        grad.addColorStop(t, color);
                    });
                    colorCtx.fillStyle = grad;
                    colorCtx.fillRect(0, 0, colorCanvas.width, colorCanvas.height);
                    colorCtx.fillStyle = '#000';
                    items.forEach(it => {
                        const t = (it.pos - min) / range; const x = Math.round(t * colorCanvas.width);
                        colorCtx.fillRect(x - 1, 0, 2, colorCanvas.height);
                    });
                }

                document.getElementById('color_btnAdd').addEventListener('click', () => addColorNode('#ffffff', 1.0));

                const selectionClickMoveThreshold = 5;

                // Old-style handlers are kept as an extra guard for browsers that trigger

                    activePointerId = null;

                    selectionPointer = false;

                    selectionPointerMoved = false;

                const interceptOptions = { capture: true };
                const wheelInterceptOptions = { capture: true, passive: false };

                canvas.addEventListener('contextmenu', suppressCanvasDefault, interceptOptions);
                canvas.addEventListener('auxclick', suppressCanvasDefault, interceptOptions);
                canvas.addEventListener('mousedown', suppressCanvasDefault, interceptOptions);
                canvas.addEventListener('mouseup', suppressCanvasDefault, interceptOptions);
                canvas.addEventListener('mousemove', suppressCanvasDefault, interceptOptions);
                canvas.addEventListener('wheel', suppressCanvasDefault, wheelInterceptOptions);
                canvas.addEventListener('dragstart', suppressCanvasDefault, interceptOptions);
                canvas.addEventListener('selectstart', suppressCanvasDefault, interceptOptions);

                window.addEventListener('contextmenu', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('auxclick', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('mousedown', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('mouseup', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('mousemove', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('pointermove', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('pointerup', suppressWindowDefaultIfNeeded, interceptOptions);
                window.addEventListener('wheel', suppressWindowDefaultIfNeeded, wheelInterceptOptions);
                window.addEventListener('blur', () => {
                    interactionRenderStats.end('window-blur');
                    clearInteractionState();
                }, interceptOptions);
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState !== 'visible') {
                        interactionRenderStats.end('document-hidden');
                        clearInteractionState();
                    }
                }, interceptOptions);

                const sendMouseEvent = (type, button, e, delta = 0, overridePos = null) => {
                    const pos = overridePos || getCanvasPos(canvas, e);
                    api.sendMouseEvent(type, button, pos.x, pos.y, delta);
                    if (api.isSlicingMode && api.isSlicingMode()) {
                        if (api.renderFrame) api.renderFrame();
                    }
                };

                canvas.addEventListener('pointerdown', (e) => {
                    suppressCanvasDefault(e);
                    try {
                        activePointerId = e.pointerId;
                        activeButton = mapPointerButtonToAction(e);
                        selectionPointer = api.getSelectionMode() !== 0 && activeButton === mouseButton.LeftButton;
                        if (selectionPointer) {
                            selectionPressPos = getCanvasPos(canvas, e);
                            activeButton = mouseButton.MiddleButton;
                        }
                        rightDragLock = activeButton === mouseButton.RightButton;
                        canvas.setPointerCapture(e.pointerId);
                        if (activeButton !== mouseButton.NoButton) {
                            interactionRenderStats.begin('drag');
                        }
                        sendMouseEvent(eventType.MousePress, activeButton, e, 0);
                    } catch (err) {
                        log(`pointer down exception: ${err && err.stack ? err.stack : err}`);
                    }
                }, interceptOptions);

                canvas.addEventListener('pointermove', (e) => {
                    if (e.pointerId === activePointerId || e.buttons !== 0) {
                        suppressCanvasDefault(e);
                    }
                    try {
                        if (selectionPointer && selectionPressPos) {
                            const pos = getCanvasPos(canvas, e);
                            const dx = pos.x - selectionPressPos.x;
                            const dy = pos.y - selectionPressPos.y;
                            if (Math.hypot(dx, dy) > selectionClickMoveThreshold) {
                                selectionPointerMoved = true;
                            }
                        }
                        // Mouse move keeps C++ side mode unchanged; mode is decided at press/release.
                        sendMouseEvent(eventType.MouseMove, mouseButton.NoButton, e, 0);
                    } catch (err) {
                        log(`pointer move exception: ${err && err.stack ? err.stack : err}`);
                    }
                }, interceptOptions);

                const handlePointerRelease = (e) => {
                    suppressCanvasDefault(e);
                    try {
                        if (canvas.hasPointerCapture(e.pointerId)) {
                            canvas.releasePointerCapture(e.pointerId);
                        }
                        const releaseButton = activeButton !== mouseButton.NoButton ? activeButton : mapPointerButtonToAction(e);
                        const releasePos = selectionPointer && !selectionPointerMoved ? selectionPressPos : null;
                        sendMouseEvent(eventType.MouseRelease, releaseButton, e, 0, releasePos);
                        if (selectionPointer && !selectionPointerMoved) {
                            readSelection();
                        }
                        if (api.isSlicingMode && api.isSlicingMode()) {
                            writeClipPlaneFields(readClipPlaneFromWasm());
                            updateSliceStatus(`Slice: active source=${api.getSliceSourceModelId()}`);

                        interactionRenderStats.end('mouse-up');

                    } catch (err) {
                        log(`pointer release exception: ${err && err.stack ? err.stack : err}`);
                        interactionRenderStats.end('mouse-up-error');
                        clearInteractionState();
                    }
                };

                    interactionRenderStats.end('lost-pointer-capture');

                }, interceptOptions);

                        interactionRenderStats.begin('wheel');

                        sendMouseEvent(eventType.Wheel, mouseButton.NoButton, e, delta);
                        interactionRenderStats.endWheelSoon();

                    const loop = () => {
                        if (viewerDestroyed || !renderLoopStarted) {
                            renderLoopStarted = false;
                            return;
                        }
                        try {
                            const frameStart = performance.now();
                            api.renderFrame();
                            const frameMs = performance.now() - frameStart;
                            interactionRenderStats.record(frameMs);
                        } catch (err) {
                            log(`render exception: ${err && err.stack ? err.stack : err}`);
                            renderLoopStarted = false;
                            return;
                        }
                        requestAnimationFrame(loop);
                    };
                    requestAnimationFrame(loop);
                };

                const loadModelBuffer = async (buf, sourceName) => {
                    const data = new Uint8Array(buf);
                    const normalizeModelName = (value) => {
                        const rawName = String(value || '');
                        const withoutQuery = rawName.split(/[?#]/, 1)[0];
                        const slashIndex = Math.max(withoutQuery.lastIndexOf('/'), withoutQuery.lastIndexOf('\\'));
                        return slashIndex >= 0 ? withoutQuery.slice(slashIndex + 1) : withoutQuery;
                    };

                    const detectModelKind = () => {
                        const normalizedName = normalizeModelName(sourceName).toLowerCase();
                        if (normalizedName.endsWith('.zip')) return 'zip';
                        if (normalizedName.endsWith('.igcm')) return 'igcm';
                        if (normalizedName.endsWith('.igc')) return 'igc';
                        if (normalizedName.endsWith('.vtp')) return 'vtp';
                        if (normalizedName.endsWith('.vtu')) return 'vtu';
                        if (normalizedName.endsWith('.vtk')) return 'vtk';

                        if (data.byteLength >= 4) {
                            const magic = Array.from(data.subarray(0, 4));
                            if (magic[0] === 0x50 && magic[1] === 0x4b) {
                                return 'zip';
                            }
                        }

                        const previewLength = Math.min(data.byteLength, 2048);
                        const previewText = new TextDecoder('utf-8', { fatal: false }).decode(data.subarray(0, previewLength));
                        if (previewText.includes('<IGCManifest')) return 'igcm';
                        if (previewText.includes('type="PolyData"') || previewText.includes('<PolyData')) return 'vtp';
                        if (previewText.includes('type="UnstructuredGrid"') || previewText.includes('<UnstructuredGrid')) return 'vtu';
                        return 'vtk';
                    };

                    let loadedResult = 0;
                    let modelKind = 'vtk';
                    let igcTimingStart = 0;
                    let igcTimingAfterLoad = 0;
                    let shouldReportIgcTiming = false;
                    try {
                        const mode = document.getElementById('importMode').value;
                        const replaceExisting = mode === 'replace' ? 1 : 0;
                        modelKind = detectModelKind();
                        const fallbackName = modelKind === 'zip'
                            ? 'Imported ZIP'
                            : (modelKind === 'igcm'
                                ? 'Imported IGCM'
                                : (modelKind === 'igc'
                                    ? 'Imported IGC'
                                    : (modelKind === 'vtp' ? 'Imported VTP' : (modelKind === 'vtu' ? 'Imported VTU' : 'Imported VTK'))));

                        if (modelKind === 'zip') {
                            loadedResult = api.loadZipFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        } else if (modelKind === 'igcm') {
                            log('IGCM references external IGC files; please upload it as a ZIP package with its referenced .igc files.');
                            loadedResult = 0;
                        } else if (modelKind === 'igc') {
                            log('IGC is a compact format that may not support all VTK features; for best compatibility, please upload as ZIP package with .igc files.');
                            shouldReportIgcTiming = true;
                            igcTimingStart = performance.now();
                            loadedResult = api.loadIgcFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                            igcTimingAfterLoad = performance.now();
                        } else if (modelKind === 'vtp') {
                            loadedResult = api.loadVtpFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        } else if (modelKind === 'vtu') {
                            loadedResult = api.loadVtuFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        } else {
                            loadedResult = api.loadVtkFromMemEx(data, sourceName || fallbackName, replaceExisting !== 0);
                        }
                    } catch (err) {
                        log(`load exception: ${err && err.stack ? err.stack : err}`);
                    }

                    if (!loadedResult) {
                        log('load model failed (.vtk/.vtu/.vtp/.igc/.igcm package .zip)');
                        return false;
                    }

                    if (modelKind === 'zip') {
                        log(`load returned loadedCount=${loadedResult}`);
                    } else {
                        log(`load returned modelId=${loadedResult}`);
                    }
                    log('model loaded, start rendering');
                    refreshModelList();
                    refreshScalarList();
                    if (shouldReportIgcTiming) {
                        const renderStart = performance.now();
                        api.renderFrame();
                        const renderEnd = performance.now();
                        log(`[IGC timing] renderFrame=${(renderEnd - renderStart).toFixed(2)} ms`);
                        await new Promise((resolve) => requestAnimationFrame(resolve));
                        const igcTimingAfterRender = performance.now();
                        log(`[IGC timing] load/decode/add=${(igcTimingAfterLoad - igcTimingStart).toFixed(2)} ms, load-to-render=${(igcTimingAfterRender - igcTimingStart).toFixed(2)} ms`);
                    }
                    startRenderLoop();
                    return true;
                };

                const igcSeries = {
                    frames: [],
                    currentIndex: -1,
                    playing: false,
                    playTimer: null,
                    requestController: null,
                    requestSerial: 0,
                };

                const setIgcSeriesStatus = (text) => {
                    document.getElementById('igcSeriesStatus').textContent = text;
                };

                const stopIgcSeries = () => {
                    igcSeries.playing = false;
                    if (igcSeries.playTimer !== null) {
                        clearTimeout(igcSeries.playTimer);
                        igcSeries.playTimer = null;
                    }
                    document.getElementById('btnPlayIgcSeries').textContent = 'Play';
                };

                const requestIgcSeriesManifest = async () => {
                    const response = await fetch('/api/series/comp/manifest', { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`manifest request failed: HTTP ${response.status}`);
                    }
                    const manifest = await response.json();
                    if (!manifest || !Array.isArray(manifest.frames) || manifest.frames.length === 0) {
                        throw new Error('manifest contains no frames');
                    }
                    igcSeries.frames = manifest.frames.slice().sort((lhs, rhs) => lhs.index - rhs.index);
                    return igcSeries.frames;
                };

                const showIgcSeriesFrame = async (requestedIndex) => {
                    if (igcSeries.frames.length === 0) {
                        await requestIgcSeriesManifest();
                    }
                    const frameCount = igcSeries.frames.length;
                    const index = (requestedIndex + frameCount) % frameCount;
                    const frame = igcSeries.frames[index];
                    const requestSerial = ++igcSeries.requestSerial;

                    if (igcSeries.requestController) {
                        igcSeries.requestController.abort();
                    }
                    igcSeries.requestController = new AbortController();

                    try {
                        // This low-memory demo intentionally releases the previous decoded model first.
                        api.removeAllModels();
                        refreshModelList();
                        refreshScalarList();
                        setIgcSeriesStatus(`Loading ${frame.name}...`);
                        log(`IGC series requesting frame ${index + 1}/${frameCount}: ${frame.name}`);

                        const response = await fetch(frame.url, {
                            cache: 'no-store',
                            signal: igcSeries.requestController.signal,
                        });
                        if (!response.ok) {
                            throw new Error(`frame request failed: HTTP ${response.status}`);
                        }
                        const bytes = new Uint8Array(await response.arrayBuffer());
                        if (requestSerial !== igcSeries.requestSerial) {
                            return false;
                        }

                        const modelId = api.loadIgcFromMemEx(bytes, frame.name, false);
                        if (!modelId) {
                            throw new Error(`decode failed: ${api.getLastErrorJson()}`);
                        }
                        log(`IGC frame load returned modelId=${modelId}`);
                        startRenderLoop();
                        api.renderFrame();
                        igcSeries.currentIndex = index;
                        refreshModelList();
                        refreshScalarList();
                        setIgcSeriesStatus(`Frame ${index + 1}/${frameCount}: ${frame.name}`);
                        log(`IGC series displayed frame ${index + 1}/${frameCount}: ${frame.name}`);
                        return true;
                    } catch (err) {
                        if (err && err.name === 'AbortError') {
                            return false;
                        }
                        stopIgcSeries();
                        setIgcSeriesStatus('Load failed');
                        log(`IGC series exception: ${err && err.stack ? err.stack : err}`);
                        return false;
                    }
                };

                const scheduleNextIgcFrame = () => {
                    if (!igcSeries.playing) return;
                    igcSeries.playTimer = setTimeout(async () => {
                        const nextIndex = igcSeries.currentIndex < 0 ? 0 : igcSeries.currentIndex + 1;
                        await showIgcSeriesFrame(nextIndex);
                        scheduleNextIgcFrame();
                    }, 1000);
                };

                document.getElementById('btnLoadIgcSeries').addEventListener('click', async () => {
                    try {
                        stopIgcSeries();
                        await requestIgcSeriesManifest();
                        log(`IGC series manifest loaded: ${igcSeries.frames.map((frame) => frame.name).join(', ')}`);
                        await showIgcSeriesFrame(0);
                    } catch (err) {
                        setIgcSeriesStatus('Manifest failed');
                        log(`IGC manifest exception: ${err && err.stack ? err.stack : err}`);
                    }
                });

                document.getElementById('btnPreviousIgcFrame').addEventListener('click', async () => {
                    stopIgcSeries();
                    await showIgcSeriesFrame(igcSeries.currentIndex <= 0 ? igcSeries.frames.length - 1 : igcSeries.currentIndex - 1);
                });

                document.getElementById('btnNextIgcFrame').addEventListener('click', async () => {
                    stopIgcSeries();
                    await showIgcSeriesFrame(igcSeries.currentIndex + 1);
                });

                document.getElementById('btnPlayIgcSeries').addEventListener('click', async () => {
                    if (igcSeries.playing) {
                        stopIgcSeries();
                        return;
                    }
                    if (igcSeries.currentIndex < 0) {
                        await showIgcSeriesFrame(0);
                    }
                    igcSeries.playing = true;
                    document.getElementById('btnPlayIgcSeries').textContent = 'Pause';
                    scheduleNextIgcFrame();
                });

                document.getElementById('btnLoadFromServer').addEventListener('click', async () => {
                    try {
                        log('Fetching remote model list...');
                        // 1. 先获取模型列表
                        const listResp = await fetch('/api/models');
                        if (!listResp.ok) {
                            log(`Failed to fetch model list: HTTP ${listResp.status}`);
                            return;
                        }
                        const listData = await listResp.json();
                        const items = listData.items || [];
                        if (items.length === 0) {
                            log('No models available on server');
                            return;
                        }

                        // 2. 简单起见，直接加载第一个模型（你可以改为让用户在下拉框中选择）
                        const model = items[0];
                        log(`Loading remote model: ${model.name} (${model.id})`);

                        const fileResp = await fetch(`/api/models/${encodeURIComponent(model.id)}/file`);
                        if (!fileResp.ok) {
                            log(`Failed to download model file: HTTP ${fileResp.status}`);
                            return;
                        }

                        const sourceName = fileResp.headers.get('X-Model-Name') || model.name;
                        const buf = await fileResp.arrayBuffer();
                        await loadModelBuffer(buf, sourceName);
                    } catch (err) {
                        log(`remote model load exception: ${err && err.stack ? err.stack : err}`);
                    }
                });

            }
        };
    </script>
    <script>
        var Module = Module || {};
        Module.locateFile = function (path, prefix) {
            if (path.endsWith('.wasm')) {
                return '@IGAME_WASM_WASM_NAME@';
            }
            return prefix + path;
        };
    </script>
    <script src="@IGAME_WASM_JS_NAME@"></script>
</body>

</html>
