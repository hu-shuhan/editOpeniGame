name: CI

on:
  push:
    branches: [main, CI-Test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Core Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    env:
      CMAKE_OPTIONS: >-
        -DENABLE_QT_MODULE=OFF
        -DENABLE_GPSCUDA_MODULE=OFF
        -DENABLE_LIBTORCH_MODULE=OFF
        -DENABLE_CGNS_MODULE=OFF
        -DENABLE_NASTRAN_MODULE=OFF
        -DEXAMPLE_COMPILE=ON
        -DGLFW_BUILD_WAYLAND=OFF
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'Cmake/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'Cmake/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            ccache \
            libgl1-mesa-dev \
            libomp-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libhdf5-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libpostproc-dev \
            xvfb

      - name: Cache HDF5 (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hdf5-root
          key: hdf5-1.14.6-win-vs2022

      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\hdf5-outer.zip"
          $dest = "$env:RUNNER_TEMP\hdf5"
          $root = "$env:RUNNER_TEMP\hdf5-root"

          $config = Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('HDF5Config.cmake', 'hdf5-config.cmake') } |
            Select-Object -First 1

          if (-not $config) {
            $url = "https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6-win-vs2022_cl.zip"

            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dest -Force

            # GitHub asset is a wrapper zip; the actual prebuilt binaries are nested inside.
            $innerZip = Get-ChildItem $dest -Recurse -Filter "HDF5-*.zip" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $innerZip) {
              Get-ChildItem $dest -Recurse | Select-Object -First 30 | ForEach-Object { $_.FullName }
              throw "Nested HDF5 binary zip not found in downloaded archive"
            }

            New-Item -ItemType Directory -Force -Path $root | Out-Null
            Expand-Archive -Path $innerZip.FullName -DestinationPath $root -Force

            $config = Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @('HDF5Config.cmake', 'hdf5-config.cmake') } |
              Select-Object -First 1
            if (-not $config) {
              Get-ChildItem $root -Recurse | Select-Object -First 30 | ForEach-Object { $_.FullName }
              throw "HDF5 cmake config not found after extracting nested archive"
            }
          }

          $hdf5Dir = $config.Directory.FullName -replace '\\', '/'
          echo "HDF5_DIR=$hdf5Dir" >> $env:GITHUB_ENV

          $binDir = Get-ChildItem $root -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'bin' } |
            Select-Object -First 1
          if ($binDir) {
            echo "$($binDir.FullName)" >> $env:GITHUB_PATH
          }

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              ${CMAKE_OPTIONS}
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release ${CMAKE_OPTIONS}
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake --build build --parallel
          else
            cmake --build build --config Release --parallel
          fi

      - name: Install
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake --build build --target install
          else
            cmake --build build --config Release --target install
          fi

      - name: Run Examples tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cd build
            ctest --output-on-failure --parallel 2
          else
            cd build
            ctest -C Release --output-on-failure --parallel 2
          fi
