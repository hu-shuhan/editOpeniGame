name: CI

on:
  push:
    branches: [main, CI-Test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Core Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    env:
      CMAKE_OPTIONS: >-
        -DENABLE_QT_MODULE=OFF
        -DENABLE_GPSCUDA_MODULE=OFF
        -DENABLE_LIBTORCH_MODULE=OFF
        -DENABLE_CGNS_MODULE=OFF
        -DENABLE_NASTRAN_MODULE=OFF
        -DEXAMPLE_COMPILE=ON
        -DGLFW_BUILD_WAYLAND=OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev \
            libomp-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libhdf5-dev \
            xvfb

      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\hdf5.msi"
          $url = "https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6-win-vs2022_cl.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$installer`" /qn ADDLOCAL=all"
          $config = Get-ChildItem "C:\Program Files\HDF Group\HDF5" -Recurse -Filter HDF5Config.cmake -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $config) {
            throw "HDF5Config.cmake not found after installing HDF5"
          }
          $hdf5Dir = $config.Directory.FullName -replace '\\', '/'
          echo "HDF5_DIR=$hdf5Dir" >> $env:GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${CMAKE_OPTIONS}
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release ${CMAKE_OPTIONS}
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake --build build --parallel
          else
            cmake --build build --config Release --parallel
          fi

      - name: Install
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake --build build --target install
          else
            cmake --build build --config Release --target install
          fi

      - name: Run Examples tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cd build
            ctest --output-on-failure --parallel 2
          else
            cd build
            ctest -C Release --output-on-failure --parallel 2
          fi
